[project]
name = "ytorg"
version = "0.1.0"
description = "유튜브 구독·재생목록 정리 자동화 도구"
requires-python = ">=3.11"

[project.scripts]
ytorg = "ytorg.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
line-length = 100
target-version = "py311"
