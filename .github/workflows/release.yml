name: 설치 파일 만들기

# 다음 중 하나로 실행된다.
# - Actions 탭에서 직접 실행
# - v로 시작하는 태그를 올릴 때
# - claude/** 브랜치에 커밋 메시지에 [installer]가 들어간 커밋을 올릴 때
# Windows 설치 파일(.exe)과 macOS 디스크 이미지(.dmg)를 만들고,
# 'v0.1.0-trial' 프리릴리스(체험판 다운로드 페이지)에 올린다.
on:
  workflow_dispatch:
  push:
    tags: ["v*"]
    branches: ["claude/**"]

permissions:
  contents: write

env:
  # Windows 콘솔(cp1252)에서 한글 출력이 깨지지 않게
  PYTHONUTF8: "1"
  PYTHONIOENCODING: utf-8

jobs:
  build:
    if: github.event_name != 'push' || startsWith(github.ref, 'refs/tags/') || contains(github.event.head_commit.message, '[installer]')
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
          - os: macos-latest
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: app/src-tauri

      - name: 엔진 의존성
        run: pip install "./engine[stt,ocr,rembg,face,translate,ffmpeg]" pyinstaller

      - name: (Windows) ffmpeg LGPL 빌드와 Tesseract(한국어) 준비
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Invoke-WebRequest https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-win64-lgpl.zip -OutFile ffmpeg.zip
          Expand-Archive ffmpeg.zip -DestinationPath ffmpeg
          $ff = Get-ChildItem ffmpeg -Recurse -Filter ffmpeg.exe | Select-Object -First 1
          "FFMPEG=$($ff.FullName)" >> $env:GITHUB_ENV
          choco install tesseract -y --no-progress
          $tess = "C:\Program Files\Tesseract-OCR"
          Invoke-WebRequest https://github.com/tesseract-ocr/tessdata_fast/raw/main/kor.traineddata -OutFile "$tess\tessdata\kor.traineddata"
          "TESS=$tess" >> $env:GITHUB_ENV

      - name: (Windows) 엔진 묶기
        if: runner.os == 'Windows'
        run: python tools/build_engine.py --ffmpeg "$env:FFMPEG" --tesseract "$env:TESS"
        shell: pwsh

      - name: (macOS) 엔진 묶기
        if: runner.os == 'macOS'
        run: python tools/build_engine.py

      # 뜨는지만 보면 묶을 때 빠진 라이브러리를 못 잡는다. 번역·받아쓰기·이미지 가리기를 실제로 돌린다.
      - name: 묶은 엔진으로 기능 점검
        shell: bash
        run: |
          exe=app/src-tauri/resources/engine/localbiseo-engine
          [ -f "$exe.exe" ] && exe="$exe.exe"
          res="$PWD/app/src-tauri/resources/tools"
          command -v cygpath >/dev/null && res=$(cygpath -w "$res")
          LOCALBISEO_RESOURCES="$res" "$exe" --port 8799 --data-dir "$RUNNER_TEMP/lb-home" &
          engine=$!
          for i in $(seq 1 90); do curl -sf http://127.0.0.1:8799/health >/dev/null && break; sleep 1; done
          curl -sf http://127.0.0.1:8799/health >/dev/null || { echo "엔진이 90초 안에 뜨지 않음"; exit 1; }
          code=0
          python tools/smoke_engine.py http://127.0.0.1:8799 ${{ runner.os == 'Windows' && '--need-ocr' || '' }} || code=$?
          kill $engine 2>/dev/null || true
          exit $code

      - name: 화면 의존성
        working-directory: app
        run: npm ci

      - name: 오픈소스 고지문
        run: python tools/notices.py

      - name: 설치 파일 빌드
        working-directory: app
        run: npx tauri build --config src-tauri/tauri.release.conf.json

      - uses: actions/upload-artifact@v4
        with:
          name: localbiseo-${{ runner.os }}
          path: |
            app/src-tauri/target/release/bundle/nsis/*.exe
            app/src-tauri/target/release/bundle/dmg/*.dmg
          if-no-files-found: error

      # 저장소 설정 > Actions > Workflow permissions가 'Read and write'여야 올라간다.
      # 권한이 없으면 건너뛰고, 설치 파일은 위의 아티팩트로 받는다.
      - name: 체험판 다운로드 페이지에 올리기
        continue-on-error: true
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v0.1.0-trial
          target_commitish: ${{ github.sha }}
          name: 로컬비서 체험판 0.1.0
          prerelease: true
          body: |
            로컬비서 14일 무료 체험판입니다.
            - Windows 10/11 64비트: `LocalBiseo_0.1.0_x64-setup.exe`
            - macOS(Apple Silicon): `.dmg` (서명 전이라 처음 열 때 '열기'를 우클릭해서 실행)
            설치 후 14일 동안 모든 기능을 쓸 수 있습니다.
          files: |
            app/src-tauri/target/release/bundle/nsis/*.exe
            app/src-tauri/target/release/bundle/dmg/*.dmg
