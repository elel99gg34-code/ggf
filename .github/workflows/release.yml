name: 설치 파일 만들기

# 태그(v0.1.0 등)를 올리거나 Actions 탭에서 직접 실행하면
# Windows 설치 파일(.exe)과 macOS 디스크 이미지(.dmg)를 만든다.
on:
  workflow_dispatch:
  push:
    tags: ["v*"]

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
          - os: macos-latest
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: app/src-tauri

      - name: 엔진 의존성
        run: pip install "./engine[stt,ocr,rembg,face,ffmpeg]" pyinstaller

      - name: (Windows) ffmpeg LGPL 빌드와 Tesseract(한국어) 준비
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Invoke-WebRequest https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-win64-lgpl.zip -OutFile ffmpeg.zip
          Expand-Archive ffmpeg.zip -DestinationPath ffmpeg
          $ff = Get-ChildItem ffmpeg -Recurse -Filter ffmpeg.exe | Select-Object -First 1
          "FFMPEG=$($ff.FullName)" >> $env:GITHUB_ENV
          choco install tesseract -y --no-progress
          $tess = "C:\Program Files\Tesseract-OCR"
          Invoke-WebRequest https://github.com/tesseract-ocr/tessdata_fast/raw/main/kor.traineddata -OutFile "$tess\tessdata\kor.traineddata"
          "TESS=$tess" >> $env:GITHUB_ENV

      - name: (Windows) 엔진 묶기
        if: runner.os == 'Windows'
        run: python tools/build_engine.py --ffmpeg "$env:FFMPEG" --tesseract "$env:TESS"
        shell: pwsh

      - name: (macOS) 엔진 묶기
        if: runner.os == 'macOS'
        run: python tools/build_engine.py

      - name: 설치 파일 빌드
        working-directory: app
        run: |
          npm ci
          npx tauri build --config src-tauri/tauri.release.conf.json

      - uses: actions/upload-artifact@v4
        with:
          name: localbiseo-${{ runner.os }}
          path: |
            app/src-tauri/target/release/bundle/nsis/*.exe
            app/src-tauri/target/release/bundle/dmg/*.dmg
          if-no-files-found: error
