name: 검사

on:
  push:
    branches: [main, "claude/**"]
  pull_request:

jobs:
  engine:
    name: 엔진 테스트
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: OCR·영상 도구 설치
        run: sudo apt-get update && sudo apt-get install -y tesseract-ocr tesseract-ocr-kor fonts-nanum ffmpeg
      - name: 엔진 설치
        run: pip install "./engine[dev,ocr,translate]" fpdf2 numpy
      - name: pytest
        working-directory: engine
        run: python -m pytest -q

  server:
    name: 라이선스 서버 테스트
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: 설치
        run: pip install -r server/requirements.txt ./engine pytest httpx
      - name: pytest
        working-directory: server
        run: python -m pytest -q

  app:
    name: 화면 빌드
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: npm ci
        working-directory: app
      - run: npm run build
        working-directory: app

  shell:
    name: 데스크톱 셸 컴파일
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Tauri 시스템 라이브러리
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev librsvg2-dev libayatana-appindicator3-dev libxdo-dev libssl-dev libxcb1-dev libxrandr-dev libdbus-1-dev libpipewire-0.3-dev libgbm-dev libegl-dev
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: app/src-tauri
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: 화면 빌드 (tauri가 dist를 읽는다)
        working-directory: app
        run: npm ci && npm run build
      - run: cargo check --locked
        working-directory: app/src-tauri
