[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "localbiseo-engine"
version = "0.1.0"
description = "로컬비서 엔진: 오프라인 회의록, 개인정보 마스킹, 이미지·영상 처리, 비서 기능"
requires-python = ">=3.10"
dependencies = [
  "fastapi>=0.110",
  "uvicorn>=0.29",
  "pydantic>=2.6",
  "pillow>=10.2",
  "pypdf>=4.0",
  "pypdfium2>=4.30",
  "python-docx>=1.1",
  "openpyxl>=3.1",
  "olefile>=0.47",
  "cryptography>=42",
]

[project.optional-dependencies]
# 무거운 기능은 선택 설치. 설치 안 돼 있으면 해당 기능만 "추가 구성요소 필요"로 표시된다.
stt = ["faster-whisper>=1.0"]
diarize = ["speechbrain>=1.0", "torch>=2.2"]
ocr = ["pytesseract>=0.3.10"]
ocr-paddle = ["paddleocr>=2.7", "paddlepaddle>=2.6"]
rembg = ["rembg>=2.0.50", "onnxruntime>=1.17"]
face = ["opencv-python-headless>=4.9,<5"]  # 5.x에서 Haar 얼굴 검출기가 빠졌다
translate = ["ctranslate2>=4,<5", "sentencepiece>=0.2,<0.3"]  # Argos 언어팩을 직접 돌린다 (torch 불필요)
llm = ["llama-cpp-python>=0.2.60"]
ffmpeg = ["imageio-ffmpeg>=0.5"]
all = ["localbiseo-engine[stt,ocr,rembg,face,translate,ffmpeg]"]
dev = ["pytest>=8", "httpx>=0.27", "pyinstaller>=6.5"]

[project.scripts]
localbiseo-engine = "localbiseo.__main__:main"

[tool.setuptools.packages.find]
include = ["localbiseo*"]

[tool.setuptools.package-data]
localbiseo = ["core/*.pem"]

[tool.pytest.ini_options]
testpaths = ["tests"]
