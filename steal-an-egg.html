<script>
/* =========================================================
 *  world.js - 맵 레이아웃 / 충돌 / 지면 프리렌더
 *  기지 -> 농장 -> 오리 연못 -> 사막 -> 정글 -> 바다 -> 공룡 계곡 -> 우주
 * ========================================================= */

const ZONE_THEME = {
  farm:   { floor:'#7cc054', floor2:'#6bab48', fog:null,                    prop:'tree'    },
  pond:   { floor:'#5fb8d8', floor2:'#4aa3c6', fog:'rgba(60,180,220,0.10)', prop:'reed'    },
  desert: { floor:'#e6c98a', floor2:'#d8b872', fog:'rgba(255,220,150,0.10)',prop:'cactus'  },
  jungle: { floor:'#2f6b3a', floor2:'#255a30', fog:'rgba(20,90,40,0.18)',   prop:'jungle'  },
  ocean:  { floor:'#1d4e86', floor2:'#173f6e', fog:'rgba(30,110,190,0.22)', prop:'coral'   },
  dino:   { floor:'#6b4230', floor2:'#57351f', fog:'rgba(180,60,20,0.14)',  prop:'volcano' },
  space:  { floor:'#181334', floor2:'#110e26', fog:'rgba(70,40,160,0.20)',  prop:'crystal' }
};

const World = {
  w: CONFIG.world.w,
  h: CONFIG.world.h,

  base: { x: 60, y: 300, w: 700, h: 900 },
  corridor: { y: 720, h: 150 },      // 구역을 잇는 통로

  zones: [],
  solids: [],
  gates: [],
  props: [],
  incubators: [],
  treadmills: [],
  shop: { x: 170, y: 1090 },
  spawns: {},
  bossSpots: {},
  ground: null,

  /* ---------------- 초기화 ---------------- */
  init() {
    const ZW = 780, ZH = 1080, ZY = 220, GAP = 60;
    let x = 880;

    this.zones.push(Object.assign({ id: 'base', name: '내 기지' }, this.base,
      { floor: '#6f7d92', floor2: '#5d6a7d' }));

    for (const z of ZONES) {
      const th = ZONE_THEME[z.id];
      this.zones.push({
        id: z.id, name: z.name, x, y: ZY, w: ZW, h: ZH,
        floor: th.floor, floor2: th.floor2, fog: th.fog, prop: th.prop, cfg: z
      });
      x += ZW + GAP;
    }
    this.w = x + 100;
    CONFIG.world.w = this.w;

    const S = (a, b, c, d) => this.solids.push({ x: a, y: b, w: c, h: d });

    /* 바깥 경계 */
    S(-60, -60, this.w + 120, 60);
    S(-60, this.h, this.w + 120, 60);
    S(-60, -60, 60, this.h + 120);
    S(this.w, -60, 60, this.h + 120);

    /* 기지 담장 (오른쪽 통로만 열림) */
    const B = this.base, CY = this.corridor.y, CH = this.corridor.h;
    this.wall(B.x, B.y, B.w, true);
    this.wall(B.x, B.y + B.h, B.w, true);
    this.wall(B.x, B.y, B.h, false);
    this.wall(B.x + B.w, B.y, B.h, false, [[CY - B.y, CH]]);

    /* 각 구역 울타리 : 좌/우 통로 개방 */
    for (const z of this.zones) {
      if (z.id === 'base') continue;
      this.wall(z.x, z.y, z.w, true);
      this.wall(z.x, z.y + z.h, z.w, true);
      this.wall(z.x, z.y, z.h, false, [[CY - z.y, CH]]);
      this.wall(z.x + z.w, z.y, z.h, false, [[CY - z.y, CH]]);

      /* 잠금 게이트: 구역 입구 */
      if (z.cfg.cost > 0) this.gates.push({ x: z.x - 16, y: CY, w: 32, h: CH, zone: z.id });

      /* 스폰 위치 */
      const list = [];
      const cols = [z.x + 130, z.x + 330, z.x + 520, z.x + 680];
      const rows = [z.y + 120, z.y + 300, z.y + 790, z.y + 950];
      rows.forEach((ry, ri) => cols.forEach((cx, ci) => {
        if ((ri + ci) % 4 === 3) return;
        list.push([cx, ry, (ri + ci) % 3 === 0 ? 1 : 0]);   // 1 = 엘리트
      }));
      this.spawns[z.id] = list;
      this.bossSpots[z.id] = { x: z.x + z.w / 2, y: z.y + z.h - 130 };

      /* 장식 */
      for (let i = 0; i < 10; i++) {
        const px = z.x + rand(70, z.w - 70);
        const py = z.y + rand(60, z.h - 60);
        if (py > CY - 70 && py < CY + CH + 70) continue;
        this.props.push({ type: z.prop, x: px, y: py, s: rand(0.75, 1.3), seed: rand(0, 10) });
      }
      /* 구역 표지판 */
      this.props.push({ type: 'sign', x: z.x + 70, y: CY - 40, zone: z.id });
    }

    /* 부화기 / 러닝머신 / 상점 */
    [[150, 430], [150, 580], [150, 730]].forEach((p, i) =>
      this.incubators.push({ i, x: p[0], y: p[1], egg: null, grow: 0, ready: false }));

    let k = 0;
    for (const ry of [470, 1060]) {
      for (const cx of [335, 445, 555, 665]) {
        this.treadmills.push({ i: k++, x: cx, y: ry, pet: null, kind: 'basic' });
      }
    }
    this.treadmills.forEach(t => S(t.x - 34, t.y - 22, 68, 30));
    this.incubators.forEach(t => S(t.x - 30, t.y - 18, 60, 26));

    this.props.push({ type: 'shop', x: this.shop.x, y: this.shop.y });
    S(this.shop.x - 50, this.shop.y - 38, 100, 36);

    this.buildGround();
  },

  /* 한 변에 구멍이 있는 벽 */
  wall(x, y, len, horiz, gaps = []) {
    const T = 24;
    let cur = 0;
    const segs = [];
    for (const [at, glen] of gaps.sort((a, b) => a[0] - b[0])) { segs.push([cur, at - cur]); cur = at + glen; }
    segs.push([cur, len - cur]);
    for (const [o, l] of segs) {
      if (l <= 0) continue;
      if (horiz) this.solids.push({ x: x + o, y: y - T / 2, w: l, h: T });
      else this.solids.push({ x: x - T / 2, y: y + o, w: T, h: l });
    }
    this.props.push({ type: 'fenceLine', x, y, len, horiz, gaps });
  },

  zoneAt(x, y) {
    for (const z of this.zones) if (x >= z.x && x <= z.x + z.w && y >= z.y && y <= z.y + z.h) return z;
    return null;
  },
  zoneDef(id) { return this.zones.find(z => z.id === id); },

  /* 원 vs 사각형 충돌 해결 */
  resolve(p, r, unlocked) {
    const list = this.solids.concat(this.gates.filter(g => !unlocked[g.zone]));
    for (let pass = 0; pass < 2; pass++) {
      for (const s of list) {
        const cx = clamp(p.x, s.x, s.x + s.w);
        const cy = clamp(p.y, s.y, s.y + s.h);
        const dx = p.x - cx, dy = p.y - cy;
        const d2 = dx * dx + dy * dy;
        if (d2 >= r * r) continue;
        if (d2 > 0.0001) {
          const d = Math.sqrt(d2);
          p.x = cx + (dx / d) * r; p.y = cy + (dy / d) * r;
        } else {
          const l = p.x - s.x, rr = s.x + s.w - p.x, t = p.y - s.y, b = s.y + s.h - p.y;
          const m = Math.min(l, rr, t, b);
          if (m === l) p.x = s.x - r; else if (m === rr) p.x = s.x + s.w + r;
          else if (m === t) p.y = s.y - r; else p.y = s.y + s.h + r;
        }
      }
    }
    p.x = clamp(p.x, 20, this.w - 20);
    p.y = clamp(p.y, 20, this.h - 20);
  },

  /* ---------------- 지면 프리렌더 ---------------- */
  buildGround() {
    const c = document.createElement('canvas');
    c.width = this.w; c.height = this.h;
    const g = c.getContext('2d');

    g.fillStyle = '#5c9b3e';
    g.fillRect(0, 0, this.w, this.h);
    for (let i = 0; i < 4000; i++) {
      g.fillStyle = Math.random() < 0.5 ? 'rgba(255,255,255,0.05)' : 'rgba(0,0,0,0.06)';
      g.fillRect(Math.random() * this.w, Math.random() * this.h, rand(6, 22), rand(3, 7));
    }

    /* 통로 */
    const CY = this.corridor.y, CH = this.corridor.h;
    g.fillStyle = '#c2a678';
    g.fillRect(this.base.x + this.base.w, CY, this.w - this.base.x - this.base.w, CH);
    g.fillStyle = 'rgba(0,0,0,0.07)';
    for (let i = 0; i < 800; i++) g.fillRect(this.base.x + this.base.w + Math.random() * (this.w - 900), CY + Math.random() * CH, rand(5, 14), rand(3, 6));

    for (const z of this.zones) {
      g.fillStyle = z.floor; g.fillRect(z.x, z.y, z.w, z.h);
      g.fillStyle = z.floor2;
      const tile = 68;
      for (let ty = 0; ty < z.h; ty += tile)
        for (let tx = 0; tx < z.w; tx += tile)
          if (((tx / tile | 0) + (ty / tile | 0)) % 2)
            g.fillRect(z.x + tx, z.y + ty, Math.min(tile, z.w - tx), Math.min(tile, z.h - ty));

      for (let i = 0; i < 1100; i++) {
        g.fillStyle = Math.random() < 0.5 ? 'rgba(255,255,255,0.08)' : 'rgba(0,0,0,0.08)';
        g.fillRect(z.x + Math.random() * z.w, z.y + Math.random() * z.h, rand(5, 16), rand(3, 6));
      }
      this.themeGround(g, z);

      /* 통로가 구역을 관통 */
      if (z.id !== 'base') {
        g.fillStyle = 'rgba(200,170,120,0.35)';
        g.fillRect(z.x, CY, z.w, CH);
      }
      /* 보스 아레나 */
      const bs = this.bossSpots[z.id];
      if (bs) {
        g.save();
        g.strokeStyle = 'rgba(255,60,60,0.55)'; g.lineWidth = 6; g.setLineDash([18, 14]);
        g.beginPath(); g.ellipse(bs.x, bs.y + 10, 150, 80, 0, 0, 7); g.stroke();
        g.setLineDash([]);
        g.fillStyle = 'rgba(255,60,60,0.10)';
        g.beginPath(); g.ellipse(bs.x, bs.y + 10, 150, 80, 0, 0, 7); g.fill();
        g.restore();
      }
    }

    /* 기지 격자 + 슬롯 */
    const B = this.zoneDef('base');
    g.strokeStyle = 'rgba(255,255,255,0.13)'; g.lineWidth = 3;
    for (let ty = B.y; ty < B.y + B.h; ty += 96) { g.beginPath(); g.moveTo(B.x, ty); g.lineTo(B.x + B.w, ty); g.stroke(); }
    for (let tx = B.x; tx < B.x + B.w; tx += 96) { g.beginPath(); g.moveTo(tx, B.y); g.lineTo(tx, B.y + B.h); g.stroke(); }

    for (const t of this.treadmills) {
      g.fillStyle = 'rgba(0,0,0,0.16)'; roundRect(g, t.x - 46, t.y - 40, 92, 96, 10); g.fill();
      g.strokeStyle = 'rgba(255,255,255,0.22)'; g.lineWidth = 3; g.setLineDash([9, 8]); g.stroke(); g.setLineDash([]);
    }
    for (const t of this.incubators) {
      g.fillStyle = 'rgba(255,255,255,0.10)'; roundRect(g, t.x - 42, t.y - 40, 84, 88, 10); g.fill();
      g.strokeStyle = 'rgba(255,255,255,0.28)'; g.lineWidth = 3; g.setLineDash([9, 8]); g.stroke(); g.setLineDash([]);
    }

    this.ground = c;
  },

  themeGround(g, z) {
    const R = (n, f) => { for (let i = 0; i < n; i++) f(z.x + Math.random() * z.w, z.y + Math.random() * z.h); };
    if (z.id === 'pond') {
      R(26, (x, y) => {
        g.fillStyle = 'rgba(255,255,255,0.16)';
        g.beginPath(); g.ellipse(x, y, rand(30, 90), rand(10, 26), 0, 0, 7); g.fill();
      });
    } else if (z.id === 'desert') {
      R(40, (x, y) => {
        g.strokeStyle = 'rgba(180,140,80,0.35)'; g.lineWidth = 3;
        g.beginPath(); g.ellipse(x, y, rand(40, 110), rand(8, 20), rand(-0.3, 0.3), 0, 7); g.stroke();
      });
    } else if (z.id === 'jungle') {
      R(120, (x, y) => {
        g.fillStyle = `rgba(${randInt(40, 90)},${randInt(120, 190)},${randInt(50, 90)},0.5)`;
        g.beginPath(); g.ellipse(x, y, rand(10, 26), rand(5, 12), rand(0, 3), 0, 7); g.fill();
      });
    } else if (z.id === 'ocean') {
      R(50, (x, y) => {
        g.strokeStyle = 'rgba(140,215,255,0.22)'; g.lineWidth = 4;
        g.beginPath(); g.arc(x, y, rand(20, 70), 0.2, 2.6); g.stroke();
      });
      R(160, (x, y) => { g.fillStyle = 'rgba(255,255,255,0.30)'; g.fillRect(x, y, 3, 3); });
    } else if (z.id === 'dino') {
      R(30, (x, y) => {
        g.fillStyle = 'rgba(255,90,20,0.30)';
        g.beginPath(); g.ellipse(x, y, rand(24, 70), rand(10, 26), rand(0, 3), 0, 7); g.fill();
      });
      R(60, (x, y) => { g.fillStyle = 'rgba(0,0,0,0.22)'; g.fillRect(x, y, rand(8, 22), rand(5, 10)); });
    } else if (z.id === 'space') {
      R(700, (x, y) => {
        const s = rand(1, 3.4);
        g.fillStyle = `rgba(255,255,255,${rand(0.25, 0.95)})`; g.fillRect(x, y, s, s);
      });
      R(6, (x, y) => {
        const gr = g.createRadialGradient(x, y, 4, x, y, 220);
        gr.addColorStop(0, `rgba(${randInt(80, 200)},${randInt(60, 160)},255,0.30)`);
        gr.addColorStop(1, 'rgba(0,0,0,0)');
        g.fillStyle = gr; g.beginPath(); g.arc(x, y, 220, 0, 7); g.fill();
      });
    }
  }
};

</script>
<script>
/* =========================================================
 *  sfx.js - WebAudio 간이 효과음
 * ========================================================= */
const Sfx = {
  ctx: null, muted: false,
  ensure() {
    if (!this.ctx) {
      try { this.ctx = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) { this.ctx = null; }
    }
    if (this.ctx && this.ctx.state === 'suspended') this.ctx.resume();
    return this.ctx;
  },
  tone(freq, dur, type = 'square', vol = 0.16, when = 0, slide = 0) {
    const c = this.ensure(); if (!c || this.muted) return;
    const t0 = c.currentTime + when;
    const o = c.createOscillator(), g = c.createGain();
    o.type = type; o.frequency.setValueAtTime(freq, t0);
    if (slide) o.frequency.exponentialRampToValueAtTime(Math.max(40, freq * slide), t0 + dur);
    g.gain.setValueAtTime(0.0001, t0);
    g.gain.exponentialRampToValueAtTime(vol, t0 + 0.012);
    g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
    o.connect(g); g.connect(c.destination);
    o.start(t0); o.stop(t0 + dur + 0.02);
  },
  play(name) {
    if (this.muted) return;
    switch (name) {
      case 'tick':  this.tone(560, 0.05, 'square', 0.08); break;
      case 'get':   this.tone(660, 0.09); this.tone(880, 0.11, 'square', 0.14, 0.08); break;
      case 'place': this.tone(420, 0.08); this.tone(560, 0.10, 'triangle', 0.12, 0.07); break;
      case 'ready': this.tone(740, 0.09, 'triangle'); this.tone(980, 0.12, 'triangle', 0.13, 0.09); break;
      case 'buy':   this.tone(520, 0.08); this.tone(700, 0.08, 'square', 0.14, 0.07); this.tone(940, 0.14, 'square', 0.14, 0.14); break;
      case 'fail':  this.tone(220, 0.20, 'sawtooth', 0.15, 0, 0.4); break;
      case 'boss':  this.tone(110, 0.35, 'sawtooth', 0.20, 0, 0.6); this.tone(160, 0.30, 'square', 0.10, 0.05, 0.5); break;
      case 'hatch': [523, 659, 784].forEach((f, i) => this.tone(f, 0.13, 'triangle', 0.14, i * 0.08)); break;
      case 'rare':  [523, 659, 784, 1046, 1318].forEach((f, i) => this.tone(f, 0.17, 'triangle', 0.16, i * 0.09)); break;
    }
  }
};

</script>
<script>
/* =========================================================
 *  input.js - 키보드 / 터치 조이스틱
 * ========================================================= */
const Input = {
  keys: {}, dirX: 0, dirY: 0, action: false,
  stick: { active: false, id: null, bx: 0, by: 0, dx: 0, dy: 0 },

  init(canvas) {
    addEventListener('keydown', e => {
      if (e.repeat) { return; }
      const k = e.key.toLowerCase();
      this.keys[k] = true;
      if ([' ', 'arrowup', 'arrowdown', 'arrowleft', 'arrowright'].includes(k)) e.preventDefault();
      if (k === 'e' || k === ' ') { this.action = true; Game.interact(); }
      if (k === 'b') UI.openShop('zone');
      if (k === 'i' || k === 'tab') { e.preventDefault(); UI.openPets(); }
      if (k === 'h' || k === '?' || k === '/') UI.openHelp();
      if (k === 'escape') UI.closeModal();
    });
    addEventListener('keyup', e => {
      const k = e.key.toLowerCase();
      this.keys[k] = false;
      if (k === 'e' || k === ' ') this.action = false;
    });
    addEventListener('blur', () => { this.keys = {}; this.action = false; });

    /* 터치 조이스틱 */
    const stick = document.getElementById('stick');
    const knob = document.getElementById('knob');
    const area = document.getElementById('touchLeft');
    const setStick = (x, y) => {
      const dx = x - this.stick.bx, dy = y - this.stick.by;
      const d = Math.hypot(dx, dy), max = 56;
      const k = d > max ? max / d : 1;
      this.stick.dx = dx * k; this.stick.dy = dy * k;
      knob.style.transform = `translate(${this.stick.dx}px, ${this.stick.dy}px)`;
    };
    const start = (x, y, id) => {
      this.stick.active = true; this.stick.id = id;
      this.stick.bx = x; this.stick.by = y;
      stick.style.left = x + 'px'; stick.style.top = y + 'px';
      stick.classList.add('on');
      setStick(x, y);
    };
    const end = () => {
      this.stick.active = false; this.stick.id = null;
      this.stick.dx = this.stick.dy = 0;
      knob.style.transform = 'translate(0,0)';
      stick.classList.remove('on');
    };
    if (area) {
      area.addEventListener('touchstart', e => {
        const t = e.changedTouches[0];
        start(t.clientX, t.clientY, t.identifier); e.preventDefault();
      }, { passive: false });
      area.addEventListener('touchmove', e => {
        for (const t of e.changedTouches) if (t.identifier === this.stick.id) setStick(t.clientX, t.clientY);
        e.preventDefault();
      }, { passive: false });
      const stop = e => {
        for (const t of e.changedTouches) if (t.identifier === this.stick.id) end();
      };
      area.addEventListener('touchend', stop);
      area.addEventListener('touchcancel', stop);
    }

    const ab = document.getElementById('abtn');
    if (ab) {
      const down = e => { e.preventDefault(); this.action = true; ab.classList.add('on'); Game.interact(); };
      const up = e => { e.preventDefault(); this.action = false; ab.classList.remove('on'); };
      ab.addEventListener('touchstart', down, { passive: false });
      ab.addEventListener('touchend', up);
      ab.addEventListener('touchcancel', up);
      ab.addEventListener('mousedown', down);
      addEventListener('mouseup', up);
    }
  },

  update() {
    let x = 0, y = 0;
    const k = this.keys;
    if (k['a'] || k['arrowleft'])  x -= 1;
    if (k['d'] || k['arrowright']) x += 1;
    if (k['w'] || k['arrowup'])    y -= 1;
    if (k['s'] || k['arrowdown'])  y += 1;
    if (this.stick.active) {
      x = this.stick.dx / 56;
      y = this.stick.dy / 56;
      if (Math.hypot(x, y) < 0.18) { x = 0; y = 0; }
    }
    this.dirX = x; this.dirY = y;
  }
};

</script>
<script>
/* =========================================================
 *  ui.js - HUD / 모달 / 튜토리얼 / 토스트
 * ========================================================= */
const UI = {
  shakeAmt: 0,
  toasts: [],
  reveal: null,
  modalTab: 'zone',

  init(game) {
    this.g = game;
    this.$ = id => document.getElementById(id);
    this.minimap = this.$('minimap');
    this.minimap.width = 260; this.minimap.height = 74;

    this.$('btnShop').onclick = () => this.openShop('zone');
    this.$('btnPets').onclick = () => this.openPets();
    this.$('btnAuto').onclick = () => Game.autoPlace();
    this.$('btnHelp').onclick = () => this.openHelp();
    this.$('btnMute').onclick = e => {
      Sfx.muted = !Sfx.muted;
      e.currentTarget.textContent = Sfx.muted ? '🔇' : '🔊';
      e.currentTarget.classList.toggle('off', Sfx.muted);
    };
    this.$('modalClose').onclick = () => this.closeModal();
    this.$('modal').addEventListener('click', e => { if (e.target.id === 'modal') this.closeModal(); });
    this.$('revealClose').onclick = () => this.closeReveal();
    this.$('startBtn').onclick = () => {
      this.$('splash').classList.add('gone');
      Sfx.ensure();
    };
    this.rc = this.$('revealCanvas');
    this.refresh();
  },

  /* ---------------- 상단 HUD ---------------- */
  fastRefresh() {
    const g = this.g;
    this.$('money').textContent = fmtMoney(g.money);
    this.$('rate').textContent = fmtMoney(g.income()) + '/초';
    this.$('bag').textContent = `${g.carrying.length}/${g.carryMax()}`;
    const z = World.zoneAt(g.player.x, g.player.y);
    this.$('zoneName').textContent = z ? (z.id === 'base' ? '🏠 내 기지' : (ZONE_BY_ID[z.id].emoji + ' ' + z.name)) : '🛣️ 이동 중';
    this.bossBar();
    this.drawReveal();
  },

  refresh() {
    const g = this.g;
    this.$('pets').textContent = g.pets.length;
    this.$('tmCount').textContent = `${World.treadmills.filter(t => t.i < g.treadmillSlots && t.pet).length}/${g.treadmillSlots}`;
    /* 튜토리얼 */
    const step = TUTORIAL[g.tutorial];
    const box = this.$('tut');
    if (!step) { box.classList.add('done'); box.innerHTML = `<div class="tut-h">✅ 튜토리얼 완료</div><div class="tut-b">이제 자유롭게 제국을 키워봐. [H] 도움말</div>`; }
    else {
      box.classList.remove('done');
      box.innerHTML =
        `<div class="tut-h"><span class="tut-n">${g.tutorial + 1}/${TUTORIAL.length}</span> ${step.title}</div>
         <div class="tut-b">${step.body}</div>`;
    }
    if (this.$('modal').classList.contains('open')) this.renderModal();
  },

  bossBar() {
    const b = Game.nearestBoss();
    const el = this.$('bossbar');
    if (!b) { el.classList.remove('on'); return; }
    el.classList.add('on');
    const c = b.cfg;
    if (b.cooldownT > 0) {
      el.innerHTML = `<div class="bb-name" style="color:${c.glow}">${c.name}</div>
        <div class="bb-sub">재등장까지 ${fmtTime(b.cooldownT)}</div>`;
      return;
    }
    const eggs = '🥚'.repeat(b.eggsLeft) + '<span class="dim">' + '🥚'.repeat(c.eggs - b.eggsLeft) + '</span>';
    const rule = b.state === 'look'
      ? '<span class="danger">쳐다보는 중 — 완전히 멈춰!</span>'
      : b.state === 'warn'
        ? '<span class="warn">❗ 돌아본다!</span>'
        : `최소 <b style="color:${RARITIES[c.minTier].glow}">${RARITIES[c.minTier].name}</b> 확정 · 분노 ${b.rage}`;
    el.innerHTML = `<div class="bb-name" style="color:${c.glow}">👑 ${c.name} <span class="bb-t">${c.title}</span></div>
      <div class="bb-eggs">${eggs}</div><div class="bb-sub">${rule}</div>`;
  },

  /* ---------------- 토스트 ---------------- */
  toast(msg, color) {
    const el = document.createElement('div');
    el.className = 'toast';
    el.style.borderColor = color || '#ffd54a';
    el.innerHTML = `<span style="color:${color || '#ffd54a'}">${msg}</span>`;
    this.$('toasts').appendChild(el);
    setTimeout(() => el.classList.add('in'), 10);
    setTimeout(() => { el.classList.remove('in'); setTimeout(() => el.remove(), 350); }, 2400);
  },

  shake(a) { this.shakeAmt = Math.max(this.shakeAmt, a); },
  tick(dt) { this.shakeAmt = Math.max(0, this.shakeAmt - dt * 1.8); if (this.reveal) this.reveal.t += dt; },

  /* ---------------- 모달 ---------------- */
  openShop(tab) { this.modalTab = tab || 'zone'; this.$('modal').classList.add('open'); Game.paused = false; this.renderModal(); Sfx.play('tick'); },
  openPets() { this.modalTab = 'pets'; this.$('modal').classList.add('open'); this.renderModal(); Sfx.play('tick'); },
  openHelp() { this.modalTab = 'help'; this.$('modal').classList.add('open'); this.renderModal(); Sfx.play('tick'); },
  closeModal() { this.$('modal').classList.remove('open'); },

  renderModal() {
    const g = this.g;
    const tabs = [
      ['zone', '🗺️ 구역'], ['gear', '🏃 러닝머신'], ['fac', '🏗️ 시설'],
      ['pets', '🐣 내 펫'], ['dex', '📖 등급표'], ['help', '❓ 도움말']
    ];
    this.$('modalTabs').innerHTML = tabs.map(([id, l]) =>
      `<button class="tab ${this.modalTab === id ? 'on' : ''}" data-tab="${id}">${l}</button>`).join('');
    this.$('modalTabs').querySelectorAll('.tab').forEach(b =>
      b.onclick = () => { this.modalTab = b.dataset.tab; this.renderModal(); });

    const body = this.$('modalBody');
    const F = {
      zone: () => this.viewZones(), gear: () => this.viewGear(), fac: () => this.viewFac(),
      pets: () => this.viewPets(), dex: () => this.viewDex(), help: () => this.viewHelp()
    };
    body.innerHTML = (F[this.modalTab] || F.zone)();
    body.querySelectorAll('[data-buy]').forEach(b => b.onclick = () => {
      const [k, v] = b.dataset.buy.split(':');
      if (k === 'zone') Game.buyZone(v);
      else if (k === 'tm') Game.buyTreadmillSlot();
      else if (k === 'inc') Game.buyIncubatorSlot();
      else if (k === 'bag') Game.buyBackpack();
      else if (k === 'up') Game.upgradeTreadmill(v);
      this.renderModal();
    });
    body.querySelectorAll('[data-sell]').forEach(b => b.onclick = () => {
      const uid = +b.dataset.sell;
      const i = Game.pets.findIndex(p => p.uid === uid);
      if (i < 0) return;
      const pet = Game.pets[i];
      const price = Math.floor(petIncome(pet) * 45);
      World.treadmills.forEach(t => { if (t.pet && t.pet.uid === uid) t.pet = null; });
      Game.pets.splice(i, 1);
      Game.money += price;
      this.toast(`${petFullName(pet)} 판매 +${fmtMoney(price)}원`, '#39ff9a');
      Sfx.play('buy'); this.refresh(); this.renderModal();
    });
  },

  card(title, sub, right, cls = '') {
    return `<div class="row ${cls}"><div class="row-l"><div class="row-t">${title}</div><div class="row-s">${sub}</div></div><div class="row-r">${right}</div></div>`;
  },
  btn(label, key, ok) {
    return `<button class="buy ${ok ? '' : 'no'}" data-buy="${key}">${label}</button>`;
  },

  viewZones() {
    const g = this.g;
    let h = `<p class="hint">구역마다 알 주인이 다르고 <b>권장속도(초당 수익 기준값)</b>가 다르다. 각 구역엔 <b>보스</b>가 하나씩 있어.</p>`;
    ZONES.forEach((z, i) => {
      const un = g.unlocked[z.id];
      const prev = i > 0 ? g.unlocked[ZONES[i - 1].id] : true;
      const boss = BOSS_BY_ZONE[z.id];
      const mobs = z.mobs.map(m => `${SPECIES[m].name}(${fmtMoney(SPECIES[m].base)})`).join(' · ');
      const right = un ? `<span class="ok">해금됨</span>`
        : prev ? this.btn(fmtMoney(z.cost) + '원', 'zone:' + z.id, g.money >= z.cost)
          : `<span class="lock">앞 구역 먼저</span>`;
      h += this.card(
        `${z.emoji} ${z.name} <span class="spd">속도 ${fmtMoney(z.speed)}/초</span>`,
        `${mobs}<br><span class="boss">👑 보스 ${boss.name} — 최소 ${RARITIES[boss.minTier].name} 확정</span>`,
        right, un ? 'on' : '');
    });
    return h;
  },

  viewGear() {
    const g = this.g;
    let h = `<p class="hint">러닝머신 슬롯을 늘리고 등급을 올려. 수익 = <b>생물 속도 × 등급배수 × 아우라배수 × 러닝머신배수</b></p>`;
    const canSlot = g.treadmillSlots < CONFIG.treadmillSlots.max;
    const sc = CONFIG.treadmillSlots.cost(g.treadmillSlots);
    h += this.card('러닝머신 슬롯 추가', `현재 ${g.treadmillSlots} / ${CONFIG.treadmillSlots.max}`,
      canSlot ? this.btn(fmtMoney(sc) + '원', 'tm:1', g.money >= sc) : `<span class="ok">MAX</span>`);
    TREADMILLS.forEach(t => {
      if (t.cost === 0) return;
      const n = World.treadmills.filter(q => q.i < g.treadmillSlots && q.kind === t.id).length;
      h += this.card(`${t.name} <span class="spd">x${t.mult}</span>`,
        `보유 ${n}대 — 가장 낮은 슬롯 1개를 업그레이드`,
        this.btn(fmtMoney(t.cost) + '원', 'up:' + t.id, g.money >= t.cost));
    });
    return h;
  },

  viewFac() {
    const g = this.g;
    let h = `<p class="hint">부화기를 늘리면 알을 동시에 키우고, 가방을 키우면 한 번에 여러 개를 훔칠 수 있어.</p>`;
    const ic = g.incubatorSlots < CONFIG.incubator.maxSlots;
    const icc = CONFIG.incubator.slotCost[g.incubatorSlots];
    h += this.card('부화기 추가', `현재 ${g.incubatorSlots} / ${CONFIG.incubator.maxSlots}`,
      ic ? this.btn(fmtMoney(icc) + '원', 'inc:1', g.money >= icc) : `<span class="ok">MAX</span>`);
    const bl = g.backpackLv < CONFIG.backpack.levels.length - 1;
    const bc = CONFIG.backpack.cost[g.backpackLv + 1];
    h += this.card('가방 확장', `한 번에 알 ${g.carryMax()}개 → ${bl ? CONFIG.backpack.levels[g.backpackLv + 1] : '-'}개`,
      bl ? this.btn(fmtMoney(bc) + '원', 'bag:1', g.money >= bc) : `<span class="ok">MAX</span>`);
    h += `<div class="stats">
      <div><b>${fmtMoney(g.totalEarned)}</b><span>총 수익</span></div>
      <div><b>${g.stolen}</b><span>훔친 알</span></div>
      <div><b>${g.hatched}</b><span>부화</span></div>
      <div><b>${g.bossKills}</b><span>보스 격파</span></div>
      <div><b>${g.best !== null ? RARITIES[g.best].name : '-'}</b><span>최고 등급</span></div>
    </div>
    <button class="danger-btn" onclick="if(confirm('정말 처음부터 다시 할래? 저장이 지워져.'))Game.reset()">저장 초기화</button>`;
    return h;
  },

  viewPets() {
    const g = this.g;
    if (!g.pets.length) return `<p class="hint">아직 펫이 없어. 알을 훔쳐서 부화시켜봐!</p>`;
    const placed = new Set(World.treadmills.filter(t => t.pet).map(t => t.pet.uid));
    const sorted = g.pets.slice().sort((a, b) => petIncome(b) - petIncome(a));
    let h = `<p class="hint">총 ${g.pets.length}마리 · 가동 중 ${placed.size}마리 · <b>[자동 배치]</b>로 최고 수익 펫만 올릴 수 있어.</p><div class="petgrid">`;
    for (const p of sorted) {
      const r = RARITY_BY_ID[p.rarity], v = VARIANT_BY_ID[p.variant], sp = SPECIES[p.species];
      h += `<div class="petcard" style="--c1:${r.c1};--c2:${r.c2};--g:${r.glow}">
        <div class="pc-rar">${r.name}${v.name ? ' · ' + v.name : ''}</div>
        <div class="pc-name">${sp.pet}</div>
        <div class="pc-inc">${fmtMoney(petIncome(p))}/초</div>
        <div class="pc-foot">${placed.has(p.uid) ? '<span class="run">가동중</span>' : '<span class="idle">대기</span>'}
          <button class="sell" data-sell="${p.uid}">판매 ${fmtMoney(Math.floor(petIncome(p) * 45))}</button></div>
      </div>`;
    }
    return h + '</div>';
  },

  viewDex() {
    let h = `<p class="hint">등급이 높을수록 수익 배수가 커진다. <b>아우라 변형</b>은 등급 위에 한 번 더 곱해져.</p><div class="rargrid">`;
    const total = RARITIES.reduce((a, r) => a + r.weight, 0);
    for (const r of RARITIES) {
      h += `<div class="rarcard" style="--c1:${r.c1};--c2:${r.c2};--g:${r.glow}">
        <div class="rc-name">${r.name}</div>
        <div class="rc-en">${r.en}</div>
        <div class="rc-m">수익 x${r.mult}</div>
        <div class="rc-p">기본 확률 ${(r.weight / total * 100).toFixed(r.weight < 50 ? 3 : 1)}%</div>
        <div class="rc-a">아우라 · ${r.auraName}</div>
      </div>`;
    }
    h += `</div><h3 class="sec">아우라 변형</h3><div class="rargrid">`;
    const vt = VARIANTS.reduce((a, v) => a + v.weight, 0);
    for (const v of VARIANTS) {
      h += `<div class="rarcard var">
        <div class="rc-name">${v.name || '기본'}</div>
        <div class="rc-m">수익 x${v.mult}</div>
        <div class="rc-p">${(v.weight / vt * 100).toFixed(1)}%</div>
      </div>`;
    }
    h += `</div><h3 class="sec">생물 권장속도</h3><div class="spdlist">`;
    for (const z of ZONES) {
      h += `<div class="spdrow"><b>${z.emoji} ${z.name}</b>` +
        z.mobs.map(m => `<span>${SPECIES[m].name} <em>${fmtMoney(SPECIES[m].base)}</em></span>`).join('') +
        `<span class="bossrow">👑 ${BOSS_BY_ZONE[z.id].name} <em>최소 ${RARITIES[BOSS_BY_ZONE[z.id].minTier].name}</em></span></div>`;
    }
    return h + '</div>';
  },

  viewHelp() {
    return `
    <h3 class="sec">조작</h3>
    <div class="keys">
      <div><kbd>W</kbd><kbd>A</kbd><kbd>S</kbd><kbd>D</kbd> 이동 (모바일: 왼쪽 화면 드래그)</div>
      <div><kbd>E</kbd> 꾹 누르기 — 알 훔치기 / 부화 / 설치</div>
      <div><kbd>B</kbd> 상점 · <kbd>I</kbd> 내 펫 · <kbd>H</kbd> 도움말 · <kbd>ESC</kbd> 닫기</div>
    </div>
    <h3 class="sec">알 훔치기</h3>
    <p class="hint">알을 품은 생물 옆에서 <b>E를 꾹</b> 누르면 게이지가 찬다.
    머리 위에 <b style="color:#ffd54a">❗</b> 가 뜨면 곧 뒤돌아본다는 신호 —
    <b style="color:#ff4d4d">즉시 손을 떼</b>. 눈이 빨개졌을 때 계속 잡고 있으면 들켜서 기절한다.</p>
    <h3 class="sec">보스는 규칙이 다르다 👑</h3>
    <p class="hint">
    구역마다 보스가 하나씩 있고 알을 <b>3개</b> 품고 있어. 보스는:<br>
    • 예고(❗)가 <b>훨씬 짧고</b>, 알을 뺏길 때마다 <b>분노</b>해서 더 짧아진다<br>
    • <b style="color:#ff4d4d">무궁화꽃이 피었습니다</b> 룰 — 쳐다볼 땐 E를 떼는 것뿐 아니라 <b>완전히 멈춰야</b> 한다<br>
    • 걸리면 <b>돌진</b>해서 날려버리고, 가방에 있던 알 1개를 떨어뜨린다<br>
    • 대신 <b>등급 하한이 보장</b>되고, 3개를 다 털면 격파 — 일정 시간 뒤 부활한다</p>
    <h3 class="sec">수익 공식</h3>
    <p class="hint"><b>생물 권장속도 × 등급 배수 × 아우라 변형 배수 × 러닝머신 배수</b><br>
    예) 고래(500K) × 코스믹(x350) × 무지개(x5) × 터보(x5) = 초당 4.4조</p>
    <h3 class="sec">기타</h3>
    <p class="hint">진행상황은 자동 저장돼. 껐다 켜면 최대 2시간치 오프라인 수익(50%)을 받아.</p>`;
  },

  /* ---------------- 부화 연출 ---------------- */
  showReveal(pet) {
    this.reveal = { pet, t: 0 };
    const r = RARITY_BY_ID[pet.rarity], v = VARIANT_BY_ID[pet.variant], sp = SPECIES[pet.species];
    const el = this.$('reveal');
    el.classList.add('open');
    el.style.setProperty('--g', r.glow);
    el.style.setProperty('--c1', r.c1);
    el.style.setProperty('--c2', r.c2);
    this.$('revTier').textContent = r.name;
    this.$('revTier').style.color = r.glow;
    this.$('revEn').textContent = r.en;
    this.$('revName').textContent = petFullName(pet);
    this.$('revInc').textContent = fmtMoney(petIncome(pet)) + ' / 초';
    this.$('revMeta').innerHTML =
      `<span>${sp.name} 계열</span><span>아우라 · ${r.auraName}</span>` +
      (v.name ? `<span class="vtag">${v.name} x${v.mult}</span>` : '');
    el.classList.toggle('big', r.tier >= 3);
    this.rc.width = 300 * 2; this.rc.height = 260 * 2;
  },
  closeReveal() { this.reveal = null; this.$('reveal').classList.remove('open'); },
  drawReveal() {
    if (!this.reveal) return;
    const { pet, t } = this.reveal;
    const c = this.rc.getContext('2d');
    c.setTransform(1, 0, 0, 1, 0, 0);
    c.clearRect(0, 0, this.rc.width, this.rc.height);
    c.setTransform(2, 0, 0, 2, 0, 0);
    const cx = 150, cy = 170;
    if (t < 0.9) {
      const sh = Math.sin(t * 40) * (2 + t * 9);
      Draw.egg(c, cx + sh, cy - 26, 72, pet.rarity, pet.variant, t, true);
    } else {
      const p = Math.min(1, (t - 0.9) / 0.35);
      c.save();
      c.translate(cx, cy);
      c.scale(0.9 + p * 0.25, 0.9 + p * 0.25);
      c.translate(-cx, -cy);
      Draw.pet(c, cx, cy + 16, pet, t, 3.0, false);
      c.restore();
    }
  },

  offlineModal(gain, secs) {
    this.toast(`오프라인 ${fmtTime(secs)} 동안 +${fmtMoney(gain)}원 벌었어! 💤`, '#39ff9a');
  }
};

</script>
<script>
/* =========================================================
 *  game.js - 상태 / 입력 / 게임 루프
 *
 *  일반 몹 : ❗ 뜨면 [E] 에서 손만 떼면 안 걸림
 *  보 스    : "무궁화꽃이 피었습니다" — 쳐다볼 때 움직이기만 해도 걸리고,
 *             걸리면 돌진해서 넉백 + 긴 기절 + 가방의 알 1개 손실
 * ========================================================= */

const Game = {
  money: 0, totalEarned: 0, stolen: 0, hatched: 0, bossKills: 0,
  best: null,
  unlocked: { farm: true },
  backpackLv: 0,
  incubatorSlots: CONFIG.incubator.baseSlots,
  treadmillSlots: CONFIG.treadmillSlots.base,
  carrying: [], pets: [], dex: {},
  tutorial: 0, lastSave: 0,

  player: {
    x: 400, y: 900, facing: 'down', phase: 0, moving: false,
    stun: 0, kx: 0, ky: 0, shirt: '#2f7dff', hatColor: '#e33b3b'
  },

  mobs: [], bosses: [], particles: [],
  cam: { x: 400, y: 900, scale: 1 },
  time: 0, target: null, stealing: null, paused: false,

  /* ================= 초기화 ================= */
  init(canvas) {
    this.canvas = canvas;
    this.ctx = canvas.getContext('2d');
    ZONES.forEach(z => { if (!(z.id in this.unlocked)) this.unlocked[z.id] = z.cost === 0; });
    World.init();
    this.spawnAll();
    this.load();
    Input.init(canvas);
    UI.init(this);
    this.resize();
    window.addEventListener('resize', () => this.resize());
    this.lastT = now();
    requestAnimationFrame(() => this.loop());
  },

  resize() {
    const dpr = Math.min(window.devicePixelRatio || 1, 2);
    const w = this.canvas.clientWidth, h = this.canvas.clientHeight;
    this.canvas.width = Math.max(1, Math.floor(w * dpr));
    this.canvas.height = Math.max(1, Math.floor(h * dpr));
    this.dpr = dpr; this.vw = w; this.vh = h;
    this.cam.scale = clamp(Math.min(w / 1420, h / 800), 0.48, 1.15);
  },

  /* ================= 스폰 ================= */
  spawnAll() {
    this.mobs = []; this.bosses = [];
    for (const z of ZONES) {
      const spots = World.spawns[z.id] || [];
      spots.forEach(([x, y, elite], i) => {
        const spId = z.mobs[elite ? 1 : 0];
        this.mobs.push(this.makeMob(z.id, spId, x, y));
      });
      const b = BOSS_BY_ZONE[z.id];
      const spot = World.bossSpots[z.id];
      if (b && spot) this.bosses.push(this.makeBoss(b, spot));
    }
  },

  makeMob(zone, spId, x, y) {
    const sp = SPECIES[spId];
    const m = {
      zone, spId, sp, boss: false,
      x, y, hx: x, hy: y, tx: x, ty: y,
      faceX: 1, phase: rand(0, 6), seed: rand(0, 10), moving: false,
      speed: rand(sp.spd[0], sp.spd[1]), waitT: rand(0.4, 2.2),
      state: 'calm', stateT: rand(1, 3),
      hasEgg: true, eggRarity: null, eggVariant: null,
      respawn: 0, flee: 0, hidden: 0, blinkT: rand(3, 8), scale: 1
    };
    this.rollEgg(m);
    return m;
  },

  makeBoss(cfg, spot) {
    return {
      zone: cfg.zone, cfg, sp: cfg, boss: true,
      x: spot.x, y: spot.y, hx: spot.x, hy: spot.y, tx: spot.x, ty: spot.y,
      faceX: -1, phase: rand(0, 6), seed: rand(0, 10), moving: false,
      speed: 58, waitT: rand(1, 3),
      state: 'calm', stateT: rand(1.2, 2.4),
      eggsLeft: cfg.eggs, rage: 0, hasEgg: true,
      eggRarity: null, eggVariant: null,
      charge: null, cooldownT: 0, scale: 1, hidden: 0
    };
  },

  rollEgg(m) {
    const r = rollRarity(m.sp.luck);
    const v = rollVariant();
    m.eggRarity = r.id; m.eggVariant = v.id; m.hasEgg = true;
  },
  rollBossEgg(b) {
    const r = rollRarityMin(b.cfg.luck, b.cfg.minTier);
    const v = rollVariant();
    b.eggRarity = r.id; b.eggVariant = v.id; b.hasEgg = b.eggsLeft > 0;
  },

  /* ================= 저장 ================= */
  save() {
    const d = {
      money: this.money, totalEarned: this.totalEarned, stolen: this.stolen,
      hatched: this.hatched, bossKills: this.bossKills, best: this.best,
      unlocked: this.unlocked, backpackLv: this.backpackLv,
      incubatorSlots: this.incubatorSlots, treadmillSlots: this.treadmillSlots,
      tutorial: this.tutorial, carrying: this.carrying, pets: this.pets, dex: this.dex,
      px: this.player.x, py: this.player.y,
      inc: World.incubators.map(i => ({ egg: i.egg, grow: i.grow, ready: i.ready })),
      tms: World.treadmills.map(t => ({ pet: t.pet, kind: t.kind })),
      savedAt: Date.now(), seq: _petSeq
    };
    try { localStorage.setItem(CONFIG.save.key, JSON.stringify(d)); } catch (e) {}
  },

  load() {
    let d = null;
    try { d = JSON.parse(localStorage.getItem(CONFIG.save.key) || 'null'); } catch (e) {}
    if (!d) return;
    this.money = d.money || 0; this.totalEarned = d.totalEarned || 0;
    this.stolen = d.stolen || 0; this.hatched = d.hatched || 0;
    this.bossKills = d.bossKills || 0; this.best = d.best ?? null;
    Object.assign(this.unlocked, d.unlocked || {});
    this.unlocked.farm = true;
    this.backpackLv = d.backpackLv || 0;
    this.incubatorSlots = d.incubatorSlots || 1;
    this.treadmillSlots = d.treadmillSlots || 1;
    this.tutorial = d.tutorial || 0;
    this.carrying = d.carrying || []; this.pets = d.pets || []; this.dex = d.dex || {};
    _petSeq = d.seq || (this.pets.length + 1);
    this.player.x = d.px || 400; this.player.y = d.py || 900;
    this.cam.x = this.player.x; this.cam.y = this.player.y;
    (d.inc || []).forEach((v, i) => {
      const inc = World.incubators[i]; if (!inc) return;
      inc.egg = v.egg || null; inc.grow = v.grow || 0; inc.ready = !!v.ready;
    });
    (d.tms || []).forEach((v, i) => {
      const t = World.treadmills[i]; if (!t) return;
      t.pet = v.pet || null; t.kind = v.kind || 'basic';
    });
    if (d.savedAt) {
      const secs = clamp((Date.now() - d.savedAt) / 1000, 0, CONFIG.offline.capHours * 3600);
      const gain = Math.floor(this.income() * secs * CONFIG.offline.rate);
      if (gain > 0 && secs > 30) {
        this.money += gain; this.totalEarned += gain;
        setTimeout(() => UI.offlineModal(gain, secs), 500);
      }
    }
  },

  reset() { try { localStorage.removeItem(CONFIG.save.key); } catch (e) {} location.reload(); },

  /* ================= 경제 ================= */
  income() {
    let s = 0;
    for (const t of World.treadmills) {
      if (t.i >= this.treadmillSlots || !t.pet) continue;
      s += petIncome(t.pet) * TREADMILL_BY_ID[t.kind].mult;
    }
    return s;
  },
  carryMax() { return CONFIG.backpack.levels[this.backpackLv]; },
  spend(n) { if (this.money < n) { UI.toast('돈이 부족해!', '#ff6b6b'); return false; } this.money -= n; return true; },
  toast(m, c) { UI.toast(m, c); },

  pop(x, y, text, color, size = 16) {
    this.particles.push({ x, y, vy: -46, life: 1.15, max: 1.15, text, color, size });
  },
  burst(x, y, color, n = 18, spread = 150) {
    for (let i = 0; i < n; i++) {
      const a = rand(0, 6.283), sp = rand(40, spread);
      this.particles.push({
        x, y, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp - 40,
        life: rand(0.5, 1.1), max: 1.1, color, size: rand(3, 7), box: true
      });
    }
  },

  /* ================= 업데이트 ================= */
  update(dt) {
    this.time += dt;
    if (this.paused) return;
    this.updatePlayer(dt);
    this.updateMobs(dt);
    this.updateBosses(dt);
    this.updateSteal(dt);
    this.updateIncubators(dt);
    this.updateEconomy(dt);
    this.updateParticles(dt);
    this.pickTarget();
    this.checkTutorial();
    const k = 1 - Math.pow(0.0015, dt);
    this.cam.x = lerp(this.cam.x, this.player.x, k);
    this.cam.y = lerp(this.cam.y, this.player.y - 40, k);
    const hw = this.canvas.width / (2 * this.cam.scale * this.dpr);
    const hh = this.canvas.height / (2 * this.cam.scale * this.dpr);
    this.cam.x = hw * 2 >= World.w ? World.w / 2 : clamp(this.cam.x, hw, World.w - hw);
    this.cam.y = hh * 2 >= World.h ? World.h / 2 : clamp(this.cam.y, hh, World.h - hh);
    if (this.time - this.lastSave > CONFIG.save.interval) { this.lastSave = this.time; this.save(); }
  },

  updatePlayer(dt) {
    const p = this.player;
    if (Math.abs(p.kx) + Math.abs(p.ky) > 1) {
      p.x += p.kx * dt; p.y += p.ky * dt;
      p.kx *= Math.pow(0.02, dt); p.ky *= Math.pow(0.02, dt);
      World.resolve(p, CONFIG.player.radius, this.unlocked);
    }
    if (p.stun > 0) { p.stun -= dt; p.moving = false; p.phase += dt * 20; return; }

    let ax = Input.dirX, ay = Input.dirY;
    const len = Math.hypot(ax, ay);
    if (len > 1) { ax /= len; ay /= len; }
    const sp = this.stealing ? 0 : CONFIG.player.speed;
    p.x += ax * sp * dt; p.y += ay * sp * dt;
    p.moving = len > 0.06 && !this.stealing;
    if (p.moving) {
      p.phase += dt * 12;
      if (Math.abs(ax) > Math.abs(ay)) p.facing = ax > 0 ? 'right' : 'left';
      else p.facing = ay > 0 ? 'down' : 'up';
    } else p.phase += dt * 2;
    World.resolve(p, CONFIG.player.radius, this.unlocked);
  },

  /* ---------- 일반 몹 ---------- */
  updateMobs(dt) {
    const p = this.player;
    for (const m of this.mobs) {
      if (!this.unlocked[m.zone]) continue;
      const far = Math.abs(m.x - this.cam.x) > 1200;
      if (!m.hasEgg) { m.respawn -= dt; if (m.respawn <= 0) this.rollEgg(m); }
      if (m.hidden > 0) { m.hidden -= dt; if (m.hidden <= 0) this.reposition(m, 120); continue; }
      if (far) continue;

      const near = dist(m.x, m.y, p.x, p.y);
      const engaged = near < CONFIG.steal.range * 2.0 && m.hasEgg;

      if (engaged) {
        m.stateT -= dt;
        if (m.stateT <= 0) {
          const A = m.sp.alert, wm = m.sp.warnMul || 1;
          if (m.state === 'calm') { m.state = 'warn'; m.stateT = CONFIG.steal.warnTime * wm / A; }
          else if (m.state === 'warn') { m.state = 'look'; m.stateT = CONFIG.steal.lookTime; }
          else { m.state = 'calm'; m.stateT = rand(CONFIG.steal.calmMin, CONFIG.steal.calmMax) / A; }
        }
      } else if (m.state !== 'calm') { m.state = 'calm'; m.stateT = rand(1.4, 3); }

      /* 특수 습성 */
      if (m.sp.burrow && !engaged) {
        m.blinkT -= dt;
        if (m.blinkT <= 0) { m.blinkT = rand(6, 14); m.hidden = 1.4; this.burst(m.x, m.y - 8, '#e6c98a', 12, 90); }
      }
      if (m.sp.blink && !engaged) {
        m.blinkT -= dt;
        if (m.blinkT <= 0) {
          m.blinkT = rand(4, 9);
          this.burst(m.x, m.y - 20, m.sp.accent, 10, 100);
          this.reposition(m, 170);
          this.burst(m.x, m.y - 20, m.sp.accent, 10, 100);
        }
      }
      if (m.sp.quake && m.moving && near < 320) UI.shake(Math.min(0.10, (320 - near) / 3200));

      if (m.flee > 0) {
        m.flee -= dt;
        const a = Math.atan2(m.y - p.y, m.x - p.x);
        m.x += Math.cos(a) * m.speed * 2.3 * dt; m.y += Math.sin(a) * m.speed * 2.3 * dt;
        m.moving = true; m.phase += dt * 17; m.faceX = Math.cos(a);
      } else if (m.state === 'look' || (this.stealing && this.stealing.mob === m)) {
        m.moving = false;
        if (m.state === 'look') m.faceX = (p.x - m.x) > 0 ? 1 : -1;
      } else {
        m.waitT -= dt;
        if (m.waitT <= 0) { this.pickWander(m, 170); m.waitT = rand(1.4, 4.2); }
        const d = dist(m.x, m.y, m.tx, m.ty);
        if (d > 6) {
          const a = Math.atan2(m.ty - m.y, m.tx - m.x);
          m.x += Math.cos(a) * m.speed * dt; m.y += Math.sin(a) * m.speed * dt;
          m.moving = true; m.phase += dt * 13; m.faceX = Math.cos(a);
        } else m.moving = false;
      }
      this.clampToZone(m);
    }
  },

  pickWander(m, r) {
    const z = World.zoneDef(m.zone);
    m.tx = clamp(m.hx + rand(-r, r), z.x + 70, z.x + z.w - 70);
    m.ty = clamp(m.hy + rand(-r, r), z.y + 70, z.y + z.h - 70);
  },
  reposition(m, r) {
    const z = World.zoneDef(m.zone);
    m.x = clamp(m.hx + rand(-r, r), z.x + 70, z.x + z.w - 70);
    m.y = clamp(m.hy + rand(-r, r), z.y + 70, z.y + z.h - 70);
    m.tx = m.x; m.ty = m.y;
  },
  clampToZone(m) {
    const z = World.zoneDef(m.zone);
    m.x = clamp(m.x, z.x + 42, z.x + z.w - 42);
    m.y = clamp(m.y, z.y + 42, z.y + z.h - 42);
  },

  /* ---------- 보스 ---------- */
  updateBosses(dt) {
    const p = this.player;
    for (const b of this.bosses) {
      if (!this.unlocked[b.zone]) continue;

      if (b.cooldownT > 0) {
        b.cooldownT -= dt;
        if (b.cooldownT <= 0) {
          b.eggsLeft = b.cfg.eggs; b.rage = 0; b.hasEgg = true;
          this.rollBossEgg(b);
          this.burst(b.x, b.y - 40, b.cfg.glow, 34, 260);
          if (dist(b.x, b.y, p.x, p.y) < 900) UI.toast(`${b.cfg.name} 부활!`, b.cfg.glow);
        }
        continue;
      }
      if (!b.eggRarity) this.rollBossEgg(b);
      if (Math.abs(b.x - this.cam.x) > 1300) continue;

      const near = dist(b.x, b.y, p.x, p.y);

      /* 돌진 중 */
      if (b.charge) {
        b.charge.t -= dt;
        const a = b.charge.a;
        b.x += Math.cos(a) * b.cfg.chargeSpeed * dt;
        b.y += Math.sin(a) * b.cfg.chargeSpeed * dt;
        b.moving = true; b.phase += dt * 22; b.faceX = Math.cos(a);
        UI.shake(0.22);
        if (near < 62 && !b.charge.hit) { b.charge.hit = true; this.bossHit(b); }
        if (b.charge.t <= 0) { b.charge = null; b.state = 'calm'; b.stateT = rand(1.4, 2.4); }
        this.clampToZone(b);
        continue;
      }

      const engaged = near < CONFIG.steal.range * 3.4 && b.eggsLeft > 0;
      if (engaged) {
        b.stateT -= dt;
        if (b.stateT <= 0) {
          const c = b.cfg;
          if (b.state === 'calm') { b.state = 'warn'; b.stateT = Math.max(0.10, c.warn * (1 - b.rage * 0.2)); }
          else if (b.state === 'warn') { b.state = 'look'; b.stateT = c.look; }
          else { b.state = 'calm'; b.stateT = rand(c.calm[0], c.calm[1]); }
        }
        /* 무궁화꽃이 피었습니다 — 볼 때 움직이면 걸림 */
        if (b.state === 'look' && near < 260) {
          const busted = this.stealing && this.stealing.mob === b ? true : p.moving;
          if (busted && p.stun <= 0) this.bossCharge(b);
        }
      } else if (b.state !== 'calm') { b.state = 'calm'; b.stateT = rand(1.2, 2.2); }

      if (b.state === 'look') { b.moving = false; b.faceX = (p.x - b.x) > 0 ? 1 : -1; }
      else {
        b.waitT -= dt;
        if (b.waitT <= 0) { this.pickWander(b, b.cfg.roam); b.waitT = rand(1.8, 4); }
        const d = dist(b.x, b.y, b.tx, b.ty);
        if (d > 8) {
          const a = Math.atan2(b.ty - b.y, b.tx - b.x);
          b.x += Math.cos(a) * b.speed * dt; b.y += Math.sin(a) * b.speed * dt;
          b.moving = true; b.phase += dt * 9; b.faceX = Math.cos(a);
        } else b.moving = false;
      }
      this.clampToZone(b);
    }
  },

  bossCharge(b) {
    const p = this.player;
    this.stealing = null;
    b.charge = { t: b.cfg.chargeTime, a: Math.atan2(p.y - b.y, p.x - b.x), hit: false };
    this.pop(b.x, b.y - 120, '들켰다!!', '#ff2b4d', 26);
    UI.shake(0.5);
    Sfx.play('boss');
  },

  bossHit(b) {
    const p = this.player;
    const a = Math.atan2(p.y - b.y, p.x - b.x);
    p.kx = Math.cos(a) * 900; p.ky = Math.sin(a) * 900;
    p.stun = b.cfg.stun;
    let msg = '기절!';
    if (this.carrying.length) { this.carrying.pop(); msg = '알을 떨어뜨렸다!'; }
    this.pop(p.x, p.y - 100, msg, '#ff4d4d', 22);
    this.burst(p.x, p.y - 40, '#ff4d4d', 22, 200);
    UI.shake(0.7);
    Sfx.play('fail');
    UI.refresh();
  },

  /* ---------- 훔치기 ---------- */
  updateSteal(dt) {
    const p = this.player;
    const holding = Input.action && p.stun <= 0;

    if (this.stealing) {
      const m = this.stealing.mob;
      const gone = m.boss ? (m.eggsLeft <= 0 || m.charge || m.cooldownT > 0) : !m.hasEgg;
      const far = dist(m.x, m.y, p.x, p.y) > CONFIG.steal.range * 1.4;
      if (gone || far) { this.stealing = null; return; }

      if (!holding) {
        this.stealing.idle = true;
        this.stealing.progress -= dt * 0.22;
        if (this.stealing.progress <= 0) this.stealing = null;
        if (!m.boss) return;
      } else this.stealing.idle = false;

      if (m.state === 'look' && !this.stealing.idle && !m.boss) { this.caught(m); return; }
      if (!this.stealing || this.stealing.idle) return;

      const ft = m.boss ? m.cfg.fillTime : CONFIG.steal.fillTime;
      this.stealing.progress += dt / ft;
      if (this.stealing.progress >= 1) this.succeed(m);

    } else if (holding && this.target && this.target.kind === 'mob') {
      if (this.carrying.length >= this.carryMax()) {
        if (!this._bagWarn || this.time - this._bagWarn > 2) {
          this._bagWarn = this.time;
          UI.toast('가방이 꽉 찼어! 부화기에 넣고 와', '#ff9f43');
        }
      } else this.stealing = { mob: this.target.ref, progress: 0, idle: false };
    }
  },

  caught(m) {
    const p = this.player;
    this.stealing = null;
    p.stun = CONFIG.steal.stunTime;
    m.flee = 1.4;
    if (m.sp.pounce) {
      const a = Math.atan2(p.y - m.y, p.x - m.x);
      p.kx = Math.cos(a) * 480; p.ky = Math.sin(a) * 480;
      p.stun += 0.5;
      this.pop(p.x, p.y - 100, '덮쳤다!', '#ff4d4d', 20);
    } else this.pop(p.x, p.y - 92, '들켰다!', '#ff4d4d', 21);
    this.burst(m.x, m.y - 26, '#ff4d4d', 14, 130);
    UI.shake(0.35);
    Sfx.play('fail');
  },

  succeed(m) {
    const p = this.player;
    this.stealing = null;
    const spId = m.boss ? m.cfg.species : m.spId;
    this.carrying.push({ species: spId, rarity: m.eggRarity, variant: m.eggVariant });
    this.stolen++;
    this.pop(p.x, p.y - 100, '알 획득!', '#39ff9a', 21);
    this.burst(m.x, m.y - 24, RARITY_BY_ID[m.eggRarity].glow, 20, 170);
    Sfx.play('get');

    if (m.boss) {
      m.eggsLeft--; m.rage++;
      if (m.eggsLeft <= 0) {
        m.hasEgg = false; m.cooldownT = m.cfg.cooldown; m.state = 'calm';
        this.bossKills++;
        this.burst(m.x, m.y - 60, m.cfg.glow, 48, 320);
        UI.toast(`${m.cfg.name} 격파! 🏆`, m.cfg.glow);
        UI.shake(0.5);
        Sfx.play('rare');
      } else {
        this.rollBossEgg(m);
        UI.toast(`${m.cfg.name} 분노! 예고가 더 짧아진다`, '#ff6b3d');
        m.state = 'calm'; m.stateT = 0.7;
      }
    } else {
      m.hasEgg = false; m.respawn = CONFIG.steal.respawn; m.flee = 0.9;
    }
    UI.refresh();
  },

  /* ---------- 부화기 ---------- */
  updateIncubators(dt) {
    for (const inc of World.incubators) {
      if (inc.i >= this.incubatorSlots) { inc.egg = null; continue; }
      if (inc.egg && !inc.ready) {
        inc.grow += dt;
        if (inc.grow >= CONFIG.incubator.growTime) { inc.ready = true; Sfx.play('ready'); }
      }
    }
  },
  putEgg(inc) {
    if (!this.carrying.length) return;
    inc.egg = this.carrying.shift(); inc.grow = 0; inc.ready = false;
    this.pop(inc.x, inc.y - 70, '알 투입', '#8ed2ff', 15);
    Sfx.play('place'); UI.refresh();
  },
  petEgg(inc) {
    inc.grow = Math.min(CONFIG.incubator.growTime, inc.grow + CONFIG.incubator.petBonus);
    this.pop(inc.x + rand(-14, 14), inc.y - 60, '쓰담', '#ffd54a', 13);
    Sfx.play('tick');
  },
  hatch(inc) {
    const e = inc.egg;
    inc.egg = null; inc.grow = 0; inc.ready = false;
    const pet = makePet(e.species, e.rarity, e.variant);
    this.pets.push(pet); this.hatched++;
    const key = pet.species + ':' + pet.rarity;
    this.dex[key] = (this.dex[key] || 0) + 1;
    const r = RARITY_BY_ID[pet.rarity];
    if (this.best === null || r.tier > this.best) this.best = r.tier;
    this.burst(inc.x, inc.y - 40, r.glow, 34, 240);
    if (r.tier >= 3) UI.shake(0.4);
    UI.showReveal(pet);
    Sfx.play(r.tier >= 3 ? 'rare' : 'hatch');
    UI.refresh();
  },

  /* ---------- 러닝머신 ---------- */
  freePets() {
    const used = new Set(World.treadmills.filter(t => t.pet).map(t => t.pet.uid));
    return this.pets.filter(p => !used.has(p.uid));
  },
  placePet(tm) {
    const free = this.freePets();
    if (!free.length) { UI.toast('배치할 펫이 없어. 알을 부화시켜!', '#ff9f43'); return; }
    free.sort((a, b) => petIncome(b) - petIncome(a));
    tm.pet = free[0];
    this.pop(tm.x, tm.y - 72, petFullName(tm.pet), RARITY_BY_ID[tm.pet.rarity].glow, 13);
    Sfx.play('place'); UI.refresh();
  },
  removePet(tm) {
    if (!tm.pet) return;
    this.pop(tm.x, tm.y - 70, '회수', '#cfd6e0', 14);
    tm.pet = null; Sfx.play('tick'); UI.refresh();
  },
  autoPlace() {
    const slots = World.treadmills.filter(t => t.i < this.treadmillSlots);
    const all = this.pets.slice().sort((a, b) => petIncome(b) - petIncome(a));
    let n = 0;
    slots.forEach((t, i) => { t.pet = all[i] || null; if (t.pet) n++; });
    UI.toast(n ? `러닝머신 ${n}대 가동!` : '배치할 펫이 없어', n ? '#39ff9a' : '#ff9f43');
    Sfx.play(n ? 'buy' : 'tick'); UI.refresh();
  },

  updateEconomy(dt) {
    const inc = this.income();
    if (inc <= 0) return;
    this.money += inc * dt; this.totalEarned += inc * dt;
    this._mt = (this._mt || 0) + dt;
    if (this._mt > 1.1) {
      this._mt = 0;
      const act = World.treadmills.filter(t => t.pet && t.i < this.treadmillSlots);
      if (act.length) {
        const t = pick(act);
        this.pop(t.x + rand(-10, 10), t.y - 64,
          '+' + fmtMoney(petIncome(t.pet) * TREADMILL_BY_ID[t.kind].mult), '#39ff9a', 13);
      }
    }
  },

  updateParticles(dt) {
    for (let i = this.particles.length - 1; i >= 0; i--) {
      const q = this.particles[i];
      q.life -= dt;
      if (q.life <= 0) { this.particles.splice(i, 1); continue; }
      if (q.box) { q.x += q.vx * dt; q.y += q.vy * dt; q.vy += 420 * dt; }
      else { q.y += q.vy * dt; q.vy += 34 * dt; }
    }
  },

  /* ---------- 상호작용 ---------- */
  pickTarget() {
    const p = this.player;
    let best = null;
    const C = (kind, ref, x, y, label, range) => {
      const d = dist(p.x, p.y, x, y);
      if (d > range) return;
      if (!best || d < best.dist) best = { kind, ref, label, dist: d, x, y };
    };
    for (const m of this.mobs) {
      if (!m.hasEgg || m.hidden > 0 || !this.unlocked[m.zone]) continue;
      C('mob', m, m.x, m.y, `${m.sp.name} 알 훔치기`, CONFIG.steal.range);
    }
    for (const b of this.bosses) {
      if (!this.unlocked[b.zone] || b.eggsLeft <= 0 || b.charge) continue;
      C('mob', b, b.x, b.y, `${b.cfg.name}의 알 훔치기`, CONFIG.steal.range * 1.25);
    }
    for (const inc of World.incubators) {
      if (inc.i >= this.incubatorSlots) continue;
      let l = null;
      if (inc.ready) l = '부화하기';
      else if (inc.egg) l = '쓰다듬기 (성장 +)';
      else if (this.carrying.length) l = '알 넣기';
      if (l) C('inc', inc, inc.x, inc.y, l, 68);
    }
    for (const tm of World.treadmills) {
      if (tm.i >= this.treadmillSlots) continue;
      C('tm', tm, tm.x, tm.y, tm.pet ? '펫 회수' : '펫 올리기', 64);
    }
    C('shop', null, World.shop.x, World.shop.y, '상점 열기', 100);
    for (const g of World.gates) {
      if (this.unlocked[g.zone]) continue;
      C('gate', g, g.x + g.w / 2, g.y + g.h / 2, `${ZONE_BY_ID[g.zone].name} 해금`, 110);
    }
    this.target = best;
  },

  interact() {
    const t = this.target;
    if (!t || this.player.stun > 0) return;
    if (t.kind === 'inc') {
      const i = t.ref;
      if (i.ready) this.hatch(i); else if (i.egg) this.petEgg(i); else this.putEgg(i);
    } else if (t.kind === 'tm') {
      if (t.ref.pet) this.removePet(t.ref); else this.placePet(t.ref);
    } else if (t.kind === 'shop') UI.openShop('zone');
    else if (t.kind === 'gate') UI.openShop('zone');
  },

  /* ---------- 구매 ---------- */
  buyZone(id) {
    const z = ZONE_BY_ID[id];
    if (this.unlocked[id]) return;
    const idx = ZONES.findIndex(q => q.id === id);
    if (idx > 0 && !this.unlocked[ZONES[idx - 1].id]) { UI.toast('앞 구역부터 해금해야 해', '#ff9f43'); return; }
    if (!this.spend(z.cost)) return;
    this.unlocked[id] = true;
    UI.toast(`${z.emoji} ${z.name} 해금! 🎉`, '#ffd54a');
    Sfx.play('buy'); UI.refresh();
  },
  buyTreadmillSlot() {
    if (this.treadmillSlots >= CONFIG.treadmillSlots.max) return;
    if (!this.spend(CONFIG.treadmillSlots.cost(this.treadmillSlots))) return;
    this.treadmillSlots++;
    UI.toast(`러닝머신 슬롯 ${this.treadmillSlots}개!`, '#39ff9a');
    Sfx.play('buy'); UI.refresh();
  },
  buyIncubatorSlot() {
    if (this.incubatorSlots >= CONFIG.incubator.maxSlots) return;
    if (!this.spend(CONFIG.incubator.slotCost[this.incubatorSlots])) return;
    this.incubatorSlots++;
    UI.toast(`부화기 ${this.incubatorSlots}개!`, '#8ed2ff');
    Sfx.play('buy'); UI.refresh();
  },
  buyBackpack() {
    if (this.backpackLv >= CONFIG.backpack.levels.length - 1) return;
    if (!this.spend(CONFIG.backpack.cost[this.backpackLv + 1])) return;
    this.backpackLv++;
    UI.toast(`가방 확장! 알 ${this.carryMax()}개까지`, '#b45cff');
    Sfx.play('buy'); UI.refresh();
  },
  upgradeTreadmill(kind) {
    const cfg = TREADMILL_BY_ID[kind];
    const tm = World.treadmills.filter(t => t.i < this.treadmillSlots)
      .find(t => TREADMILL_BY_ID[t.kind].mult < cfg.mult);
    if (!tm) { UI.toast('전부 이미 그 등급 이상이야', '#ff9f43'); return; }
    if (!this.spend(cfg.cost)) return;
    tm.kind = kind;
    UI.toast(`${cfg.name} 설치! (슬롯 ${tm.i + 1})`, cfg.frame);
    Sfx.play('buy'); UI.refresh();
  },

  /* ---------- 튜토리얼 ---------- */
  checkTutorial() {
    const s = TUTORIAL[this.tutorial];
    if (!s) return;
    let done = false;
    switch (s.id) {
      case 'move': done = (this._moved || 0) > 240; break;
      case 'goFarm': done = World.zoneAt(this.player.x, this.player.y)?.id === 'farm'; break;
      case 'steal': done = this.stolen > 0; break;
      case 'deliver': done = World.incubators.some(i => i.egg) || this.hatched > 0; break;
      case 'hatch': done = this.hatched > 0; break;
      case 'place': done = World.treadmills.some(t => t.pet); break;
      case 'buy': done = this.treadmillSlots > 1 || this.unlocked.pond; break;
      case 'boss': done = this.bossKills > 0; break;
    }
    if (!done) return;
    this.tutorial++;
    UI.refresh();
    if (this.tutorial >= TUTORIAL.length) {
      UI.toast('튜토리얼 완료! 이제 제국을 세워봐 👑', '#ffd54a');
      Sfx.play('rare');
    } else Sfx.play('ready');
  },

  tutorialTarget() {
    const s = TUTORIAL[this.tutorial];
    if (!s) return null;
    const z = World.zoneDef('farm');
    switch (s.id) {
      case 'goFarm': return { x: z.x + 200, y: World.corridor.y + 70 };
      case 'steal': {
        let bm = null, bd = 1e9;
        for (const m of this.mobs) {
          if (m.zone !== 'farm' || !m.hasEgg) continue;
          const d = dist2(m.x, m.y, this.player.x, this.player.y);
          if (d < bd) { bd = d; bm = m; }
        }
        return bm;
      }
      case 'deliver': return World.incubators[0];
      case 'hatch': return World.incubators.find(i => i.egg) || World.incubators[0];
      case 'place': return World.treadmills[0];
      case 'buy': return World.shop;
      case 'boss': return this.bosses.find(b => b.zone === 'farm' && b.eggsLeft > 0);
    }
    return null;
  },

  nearestBoss() {
    let b = null, bd = 620;
    for (const q of this.bosses) {
      if (!this.unlocked[q.zone]) continue;
      const d = dist(q.x, q.y, this.player.x, this.player.y);
      if (d < bd) { bd = d; b = q; }
    }
    return b;
  },

  /* ================= 렌더 ================= */
  render() {
    const ctx = this.ctx, t = this.time;
    const S = this.cam.scale * this.dpr;
    ctx.setTransform(1, 0, 0, 1, 0, 0);
    ctx.fillStyle = '#0b0e16';
    ctx.fillRect(0, 0, this.canvas.width, this.canvas.height);

    const sh = UI.shakeAmt;
    const ox = this.canvas.width / 2 - this.cam.x * S + (sh ? rand(-10, 10) * sh : 0);
    const oy = this.canvas.height / 2 - this.cam.y * S + (sh ? rand(-10, 10) * sh : 0);
    ctx.setTransform(S, 0, 0, S, ox, oy);

    ctx.drawImage(World.ground, 0, 0);

    for (const z of World.zones) {
      if (z.id === 'base' || !this.unlocked[z.id]) continue;
      if (z.fog) { ctx.fillStyle = z.fog; ctx.fillRect(z.x, z.y, z.w, z.h); }
    }

    for (const g of World.gates) {
      if (this.unlocked[g.zone]) continue;
      const z = ZONE_BY_ID[g.zone];
      const grd = ctx.createLinearGradient(g.x, 0, g.x + g.w, 0);
      grd.addColorStop(0, 'rgba(255,80,80,0.10)');
      grd.addColorStop(0.5, `rgba(255,80,80,${0.45 + Math.sin(t * 4) * 0.15})`);
      grd.addColorStop(1, 'rgba(255,80,80,0.10)');
      ctx.fillStyle = grd; ctx.fillRect(g.x, g.y, g.w, g.h);
      ctx.strokeStyle = '#ff5a5a'; ctx.lineWidth = 3; ctx.strokeRect(g.x, g.y, g.w, g.h);
      outlineText(ctx, '🔒 ' + z.name, g.x + g.w / 2, g.y - 30, 19, '#ffd54a', '#000');
      outlineText(ctx, fmtMoney(z.cost) + '원', g.x + g.w / 2, g.y - 8, 15, '#fff', '#000');
      outlineText(ctx, '[E] 해금', g.x + g.w / 2, g.y + g.h + 16, 14, '#8ed2ff', '#000');
    }

    const list = [];
    for (const p of World.props) {
      if (p.type === 'fenceLine') { Draw.prop(ctx, p, t); continue; }
      list.push({ y: p.y, f: () => Draw.prop(ctx, p, t) });
    }
    for (const inc of World.incubators) {
      if (inc.i >= this.incubatorSlots) continue;
      list.push({ y: inc.y, f: () => Draw.incubator(ctx, inc, t) });
    }
    for (const tm of World.treadmills) {
      if (tm.i >= this.treadmillSlots) continue;
      list.push({ y: tm.y, f: () => Draw.treadmill(ctx, tm, t) });
    }
    const vis = 1000 / this.cam.scale;
    for (const m of this.mobs) {
      if (!this.unlocked[m.zone] || m.hidden > 0) continue;
      if (Math.abs(m.x - this.cam.x) > vis || Math.abs(m.y - this.cam.y) > vis) continue;
      list.push({ y: m.y, f: () => Draw.creature(ctx, m, t) });
    }
    for (const b of this.bosses) {
      if (!this.unlocked[b.zone] || b.cooldownT > 0) continue;
      if (Math.abs(b.x - this.cam.x) > vis + 300) continue;
      list.push({ y: b.y, f: () => Draw.creature(ctx, b, t) });
    }
    const p = this.player;
    list.push({
      y: p.y, f: () => Draw.avatar(ctx, {
        x: p.x, y: p.y, facing: p.facing, phase: p.phase, moving: p.moving,
        shirt: p.shirt, hatColor: p.hatColor,
        carry: this.carrying.length > 0, stunned: p.stun > 0
      })
    });
    list.sort((a, b) => a.y - b.y);
    for (const it of list) it.f();

    /* 잠긴 구역은 내용물까지 어둡게 */
    for (const z of World.zones) {
      if (z.id === 'base' || this.unlocked[z.id]) continue;
      ctx.fillStyle = 'rgba(6,8,16,0.70)';
      ctx.fillRect(z.x, z.y, z.w, z.h);
    }

    /* 보스 쿨다운 표시 */
    for (const b of this.bosses) {
      if (!this.unlocked[b.zone] || b.cooldownT <= 0) continue;
      if (Math.abs(b.x - this.cam.x) > vis) continue;
      outlineText(ctx, `${b.cfg.name} 재등장까지`, b.x, b.y - 40, 15, '#9aa7b8', '#000');
      outlineText(ctx, fmtTime(b.cooldownT), b.x, b.y - 18, 20, '#ffd54a', '#000');
    }

    if (this.carrying.length) {
      const e = this.carrying[0];
      Draw.egg(ctx, p.x, p.y - 54 + Math.sin(t * 3) * 1.5, 20, e.rarity, e.variant, t, true);
      if (this.carrying.length > 1) outlineText(ctx, 'x' + this.carrying.length, p.x + 19, p.y - 64, 14, '#fff', '#000');
    }

    if (this.stealing) {
      const m = this.stealing.mob;
      const danger = m.state === 'warn' || m.state === 'look';
      const top = m.y - (m.boss ? 150 : 82);
      Draw.bar(ctx, m.x, top, 92, 11, this.stealing.progress, danger ? '#ff4d4d' : '#39ff9a');
      const msg = m.boss
        ? (m.state === 'look' ? '멈춰!! 움직이면 죽는다' : danger ? '손 떼고 멈춰!' : '훔치는 중...')
        : (danger ? '손 떼!!' : '훔치는 중...');
      outlineText(ctx, msg, m.x, top - 19, 15, danger ? '#ff4d4d' : '#fff', '#000');
    }

    if (this.target && !this.stealing) {
      const tg = this.target;
      const y = tg.kind === 'mob' && tg.ref.boss
        ? tg.y + 38
        : tg.y - (tg.kind === 'mob' ? 78 : tg.kind === 'shop' ? 112 : 84);
      const label = ` [E] ${tg.label} `;
      ctx.save();
      ctx.font = '800 15px "Pretendard",system-ui,sans-serif';
      const w = ctx.measureText(label).width + 14;
      roundRect(ctx, tg.x - w / 2, y - 15, w, 29, 9);
      ctx.fillStyle = 'rgba(10,12,18,0.88)'; ctx.fill();
      ctx.strokeStyle = 'rgba(255,255,255,0.35)'; ctx.lineWidth = 2; ctx.stroke();
      outlineText(ctx, label, tg.x, y, 15, '#fff', 'rgba(0,0,0,0)');
      ctx.restore();
    }

    const tt = this.tutorialTarget();
    if (tt) {
      const a = Math.atan2(tt.y - p.y, tt.x - p.x);
      if (dist(p.x, p.y, tt.x, tt.y) > 100) {
        const rr = 66 + Math.sin(t * 5) * 8;
        ctx.save();
        ctx.translate(p.x + Math.cos(a) * rr, p.y - 40 + Math.sin(a) * rr);
        ctx.rotate(a);
        ctx.fillStyle = '#ffd54a'; ctx.strokeStyle = '#000'; ctx.lineWidth = 3; ctx.lineJoin = 'round';
        ctx.beginPath(); ctx.moveTo(17, 0); ctx.lineTo(-10, -13); ctx.lineTo(-4, 0); ctx.lineTo(-10, 13);
        ctx.closePath(); ctx.fill(); ctx.stroke();
        ctx.restore();
      }
    }

    for (const q of this.particles) {
      const a = clamp(q.life / q.max, 0, 1);
      ctx.save(); ctx.globalAlpha = a;
      if (q.box) { ctx.fillStyle = q.color; ctx.fillRect(q.x, q.y, q.size, q.size); }
      else outlineText(ctx, q.text, q.x, q.y, q.size, q.color, '#000');
      ctx.restore();
    }

    ctx.setTransform(1, 0, 0, 1, 0, 0);
    this.renderMinimap();
  },

  renderMinimap() {
    const mm = UI.minimap; if (!mm) return;
    const g = mm.getContext('2d');
    const W = mm.width, H = mm.height;
    const sx = W / World.w, sy = H / World.h;
    g.clearRect(0, 0, W, H);
    g.fillStyle = 'rgba(12,15,22,0.9)'; g.fillRect(0, 0, W, H);
    for (const z of World.zones) {
      const un = z.id === 'base' || this.unlocked[z.id];
      g.fillStyle = un ? z.floor : '#2a2f3a';
      g.fillRect(z.x * sx, z.y * sy, z.w * sx, z.h * sy);
      if (!un) { g.fillStyle = 'rgba(255,80,80,0.30)'; g.fillRect(z.x * sx, z.y * sy, z.w * sx, z.h * sy); }
    }
    g.fillStyle = 'rgba(200,170,120,0.7)';
    g.fillRect((World.base.x + World.base.w) * sx, World.corridor.y * sy,
      (World.w - World.base.x - World.base.w) * sx, World.corridor.h * sy);
    for (const b of this.bosses) {
      if (!this.unlocked[b.zone]) continue;
      g.fillStyle = b.cooldownT > 0 ? '#555' : '#ffd54a';
      g.fillRect(b.x * sx - 2.5, b.y * sy - 2.5, 5, 5);
    }
    const p = this.player;
    g.fillStyle = '#ff3b3b';
    g.beginPath(); g.arc(p.x * sx, p.y * sy, 3.6, 0, 7); g.fill();
    g.strokeStyle = '#fff'; g.lineWidth = 1.4; g.stroke();
  },

  loop() {
    const t = now();
    let dt = Math.min(t - this.lastT, 0.05);
    this.lastT = t;
    Input.update();
    if (this.player.moving) this._moved = (this._moved || 0) + CONFIG.player.speed * dt;
    this.update(dt);
    UI.tick(dt);
    this.render();
    UI.fastRefresh();
    requestAnimationFrame(() => this.loop());
  }
};

</script>
<script>Game.init(document.getElementById('game'));</script>
</body>
