.stat{color:var(--sub);font-size:14px;white-space:nowrap;margin-left:auto}

.card{position:relative;background:var(--panel);border:1px solid var(--line);border-radius:22px;overflow:hidden;transition:transform .18s,box-shadow .18s,border-color .18s;display:flex;flex-direction:column}

.thumb .pl i{font-style:normal;background:#fff;color:#111;padding:10px 22px;border-radius:999px}
.card:hover .pl{opacity:1}
.body{padding:14px 16px 16px;display:flex;flex-direction:column;gap:6px;flex:1}
.body h4{font-size:19px;font-weight:800}
.body p{color:var(--sub);font-size:14px;line-height:1.45;flex:1}
.meta{display:flex;justify-content:space-between;align-items:center;font-size:13px;margin-top:4px}

footer{color:#5c6699;text-align:center;font-size:13px;padding:30px}

  function find(st, q) {
    var c = st.c, n = q.length;
    for (var i = 0; i + n <= c.length; i++) {
      var ok = true;
      for (var j = 0; j < n; j++) { var a = c[i + j], b = q[j]; if (a !== b && !(isCho(b) && choOf(a) === b)) { ok = false; break; } }
      if (ok) return i;
    }
    return -1;
  }
  var PRE = G.map(function (g) { return { t: strip(g.t), al: strip((ALIAS[g.id] || '') + ' ' + g.id), c: strip(C[g.c] || ''), d: strip(g.d) }; });
  function score(g, q) {
    var P = PRE[IDX[g.id]], i = find(P.t, q);
    if (i === 0) return { s: 100 - P.t.c.length * 0.1, h: [0, q.length] };
    if (i > 0) return { s: 80 - i, h: [i, q.length] };
    if (find(P.al, q) >= 0) return { s: 60 };
    if (find(P.c, q) >= 0) return { s: 40 };
    if (q.length >= 2 && !q.some(isCho) && find(P.d, q) >= 0) return { s: 20 };
    return null;
  }
  function hl(g, h) {
    if (!h) return esc(g.t);
    var pos = PRE[IDX[g.id]].t.pos, a = pos[h[0]], b = pos[h[0] + h[1] - 1] + 1;
    return esc(g.t.slice(0, a)) + '<mark>' + esc(g.t.slice(a, b)) + '</mark>' + esc(g.t.slice(b));
  }
  function search(term) {
    var q = norm(term).split('');
    if (!q.length) return null;
    var out = [];
    G.forEach(function (g) { var r = score(g, q); if (r) out.push({ g: g, s: r.s + g.p * 0.05, h: r.h }); });
    out.sort(function (a, b) { return b.s - a.s; });
    return out;
  }

  /* ---------- 히어로 ---------- */
  var byPop = G.slice().sort(function (a, b) { return b.p - a.p || IDX[a.id] - IDX[b.id]; });
  document.getElementById('hero').innerHTML = byPop.slice(0, 5).map(function (g, i) {
    return '<a href="' + url(g.id) + '" style="background:' + grad(g.c, i) + '"><div class="em">' + g.e + '</div>' +
      '<span class="tag">' + (i === 0 ? '🔥 인기 1위' : '🏆 TOP ' + (i + 1)) + '</span><h2>' + esc(g.t) + '</h2>' +
      (i === 0 ? '<p>' + esc(g.d) + '</p><span class="play">▶ 지금 플레이</span>' : '') + '</a>';
  }).join('');

  /* ---------- 통계 ---------- */
  var totalPlays = Object.keys(plays).reduce(function (s, k) { return s + plays[k]; }, 0);
  document.getElementById('stat').textContent = '총 ' + G.length + '개 · 해본 게임 ' + Object.keys(plays).length + '개 · ' + totalPlays + '판';

  /* ---------- 최근 ---------- */
  var rec = get('hub_recent', []).map(function (id) { return G[IDX[id]]; }).filter(Boolean);
  if (rec.length) {
    document.getElementById('recentWrap').style.display = '';
    document.getElementById('recent').innerHTML = rec.map(function (g, i) {
      var b = best(g.id);
      return '<a href="' + url(g.id) + '"><div class="ic" style="background:' + grad(g.c, i) + '">' + g.e + '</div><div><b>' + esc(g.t) + '</b><small>' + (b !== null ? '최고 ' + Number(b).toLocaleString() : '기록 없음') + '</small></div></a>';
    }).join('');
  }

  /* ---------- 칩 ---------- */
  function chips() {
    var counts = { all: G.length, fav: fav.length };
    G.forEach(function (g) { counts[g.c] = (counts[g.c] || 0) + 1; });
    var list = [['all', '전체'], ['fav', '⭐ 즐겨찾기']].concat(Object.keys(C).map(function (k) { return [k, C[k]]; }));
    document.getElementById('chips').innerHTML = list.map(function (x) {
      return '<button class="chip' + (cat === x[0] ? ' on' : '') + '" data-c="' + x[0] + '">' + x[1] + '<span class="n">' + (counts[x[0]] || 0) + '</span></button>';
    }).join('') + '<select id="sort"><option value="pop">인기순</option><option value="name">이름순</option><option value="played">많이 한 순</option><option value="cat">카테고리순</option><option value="new">최신 추가순</option></select>';
    var s = document.getElementById('sort');
    s.value = sort;
    s.onchange = function () { sort = s.value; set('hub_sort', sort); render(); };
    document.querySelectorAll('#chips .chip').forEach(function (b) {
      b.onclick = function () { cat = b.dataset.c; set('hub_cat', cat); chips(); render(); };
    });
  }

  /* ---------- 그리드 ---------- */
  var q = document.getElementById('q');
  function card(g, h) {
    var b = best(g.id), on = fav.indexOf(g.id) >= 0, r = RANK[g.id];
    return '<a class="card" href="' + url(g.id) + '">' + (r ? '<span class="hot">🏆 ' + r + '위</span>' : g.p >= 90 ? '<span class="hot">HOT</span>' : '') +
      '<button class="fav' + (on ? ' on' : '') + '" data-id="' + g.id + '" title="즐겨찾기">' + (on ? '★' : '☆') + '</button>' +
      '<div class="thumb" style="background:' + grad(g.c, IDX[g.id]) + '"><span>' + g.e + '</span><div class="pl"><i>▶ PLAY</i></div></div>' +
      '<div class="body"><h4>' + hl(g, h) + '</h4><p>' + esc(g.d) + '</p><div class="meta"><span class="cat">' + C[g.c] + '</span>' +
      '<span class="best">' + (b !== null ? '🏆 ' + Number(b).toLocaleString() : '') + '</span></div></div></a>';
  }
  function render() {
    var term = q.value.trim(), res = search(term), H = {};
    var list = res ? res.map(function (r) { H[r.g.id] = r.h; return r.g; }) : G.slice();
    list = list.filter(function (g) {
      if (cat === 'fav' && fav.indexOf(g.id) < 0) return false;
      if (cat !== 'all' && cat !== 'fav' && g.c !== cat) return false;
      return true;
    });
    if (!res) list.sort(function (a, b) {
      if (sort === 'name') return a.t.localeCompare(b.t, 'ko');
      if (sort === 'played') return (plays[b.id] || 0) - (plays[a.id] || 0) || b.p - a.p;
      if (sort === 'cat') return a.c.localeCompare(b.c) || b.p - a.p;
      if (sort === 'new') return IDX[b.id] - IDX[a.id];
      return b.p - a.p || IDX[a.id] - IDX[b.id];
    });
    var qh = document.getElementById('qhint');
    if (res) {
      qh.style.display = '';
      qh.innerHTML = '“<b>' + esc(term) + '</b>” 검색 결과 ' + list.length + '개 · 관련도순' + (cat !== 'all' ? ' · <b>' + (cat === 'fav' ? '즐겨찾기' : C[cat]) + '</b> 안에서만 (전체에서는 ' + res.length + '개)' : '');
    } else qh.style.display = 'none';
    document.getElementById('count').textContent = list.length + '개';
    document.getElementById('empty').style.display = list.length ? 'none' : '';
    document.getElementById('grid').innerHTML = list.map(function (g) { return card(g, H[g.id]); }).join('');
  }
  document.getElementById('grid').addEventListener('click', function (e) {
    var b = e.target.closest('.fav');
    if (!b) return;
    e.preventDefault(); e.stopPropagation();
    var id = b.dataset.id, i = fav.indexOf(id);
    if (i >= 0) fav.splice(i, 1); else fav.push(id);
    set('hub_fav', fav); chips(); render();
  });

  /* ---------- 자동완성 ---------- */
  var sug = document.getElementById('sug'), sel = -1, sugList = [];
  function showSug() {
    var res = search(q.value.trim());
    sel = -1;
    if (!res || document.activeElement !== q) { sug.classList.remove('show'); return; }
    sugList = res.slice(0, 8);
    sug.innerHTML = sugList.length ? sugList.map(function (r, i) {
      return '<a href="' + url(r.g.id) + '" data-i="' + i + '"><span class="e">' + r.g.e + '</span><span><b>' + hl(r.g, r.h) + '</b><small>' + C[r.g.c] + (RANK[r.g.id] ? ' · 🏆 ' + RANK[r.g.id] + '위' : '') + '</small></span></a>';
    }).join('') + (res.length > 8 ? '<div class="more">Enter: 첫 번째 실행 · 아래 목록에서 ' + res.length + '개 모두 보기</div>' : '') : '<div class="more">일치하는 게임이 없어요</div>';
    sug.classList.add('show');
  }
  function mark() { sug.querySelectorAll('a').forEach(function (a, i) { a.classList.toggle('sel', i === sel); }); }
  q.addEventListener('input', function () { if (view !== 'home') go('home'); render(); showSug(); });
  q.addEventListener('focus', showSug);
  q.addEventListener('blur', function () { setTimeout(function () { sug.classList.remove('show'); }, 150); });
  q.addEventListener('keydown', function (e) {
    if (e.key === 'ArrowDown' || e.key === 'ArrowUp') { e.preventDefault(); var n = sugList.length; if (n) { if (e.key === 'ArrowDown') sel = sel + 1 >= n ? -1 : sel + 1; else sel = sel - 1 < -1 ? n - 1 : sel - 1; mark(); } }
    else if (e.key === 'Enter') { var r = sugList[sel >= 0 ? sel : 0]; if (r && sug.classList.contains('show')) location.href = url(r.g.id); }
    else if (e.key === 'Escape') { sug.classList.remove('show'); q.blur(); }
  });
  document.addEventListener('keydown', function (e) {
    if (e.key === '/' && document.activeElement !== q) { e.preventDefault(); q.focus(); }
  });
  document.getElementById('rand').onclick = function () { location.href = url(G[Math.floor(Math.random() * G.length)].id); };

  /* ---------- TOP 50 ---------- */
  var RANK = {};
  byPop.slice(0, 50).forEach(function (g, i) { RANK[g.id] = i + 1; });
  var tcat = get('hub_tcat', 'all');
  function top50() {
    var mine = tcat === 'mine';
    var list = G.filter(function (g) { return mine ? plays[g.id] > 0 : tcat === 'all' || g.c === tcat; });
    list.sort(mine ? function (a, b) { return plays[b.id] - plays[a.id] || b.p - a.p; } : function (a, b) { return b.p - a.p || IDX[a.id] - IDX[b.id]; });
    list = list.slice(0, 50);
    var opts = [['all', '🌐 종합'], ['mine', '🙋 내가 많이 한']].concat(Object.keys(C).map(function (k) { return [k, C[k]]; }));
    document.getElementById('tbar').innerHTML = opts.map(function (x) { return '<button class="chip' + (tcat === x[0] ? ' on' : '') + '" data-t="' + x[0] + '">' + x[1] + '</button>'; }).join('');
    document.querySelectorAll('#tbar .chip').forEach(function (b) { b.onclick = function () { tcat = b.dataset.t; set('hub_tcat', tcat); top50(); }; });
    document.getElementById('tsub').textContent = mine ? '내 플레이 횟수 기준' : '인기 지수 기준 · ' + (tcat === 'all' ? '전체 ' + G.length + '개 중' : C[tcat] + ' ' + G.filter(function (g) { return g.c === tcat; }).length + '개 중');
    var val = function (g) { return mine ? plays[g.id] + '판' : '인기 ' + g.p; };
    var mx = list.length ? (mine ? plays[list[0].id] : 100) : 1;
    var MD = ['🥇', '🥈', '🥉'];
    var pod = [1, 0, 2].filter(function (i) { return list[i]; });
    document.getElementById('podium').innerHTML = pod.map(function (i) {
      var g = list[i];
      return '<a class="r' + (i + 1) + '" href="' + url(g.id) + '" style="background:' + grad(g.c, i) + '"><span class="md">' + MD[i] + '</span><div class="e">' + g.e + '</div><h2>' + esc(g.t) + '</h2><p>' + C[g.c] + ' · ' + val(g) + '</p></a>';
    }).join('');
    document.getElementById('rank').innerHTML = list.length ? list.slice(3).map(function (g, k) {
      var i = k + 3, b = best(g.id), v = mine ? plays[g.id] : g.p;
      return '<a class="row" href="' + url(g.id) + '"><span class="n">' + (i + 1) + '</span><span class="ic" style="background:' + grad(g.c, i) + '">' + g.e + '</span>' +
        '<span class="tx"><b>' + esc(g.t) + '</b><small>' + C[g.c] + (b !== null ? ' · 내 최고 ' + Number(b).toLocaleString() : '') + '</small></span>' +
        '<span class="sc"><em>' + val(g) + '</em><i style="width:' + Math.max(8, Math.round(v / mx * 100)) + '%"></i></span></a>';
    }).join('') : '<div class="empty">아직 플레이한 게임이 없어요. 하나 골라서 시작해 보세요!</div>';
  }

  /* ---------- 화면 전환 ---------- */
  var view = 'home';
  function go(v) {
    view = v;
    document.body.classList.toggle('v-top', v === 'top');
    document.querySelectorAll('.nav a').forEach(function (a) { a.classList.toggle('on', a.dataset.v === v); });
    if (v === 'top') top50();
  }
  function route() { go(location.hash === '#top50' ? 'top' : 'home'); }
  window.addEventListener('hashchange', function () { route(); window.scrollTo(0, 0); });
  chips();
  render();
  route();
})();
</script>
</body>
</html>
