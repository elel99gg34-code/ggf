<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="캔버스로 구현한 9이닝 야구 게임. 투구 타이밍에 맞춰 스윙하고 야수·주자가 실제로 움직인다.">
<style>
  :root { color-scheme: dark; padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); }
  body { margin: 0; font: 14px/1.5 system-ui, sans-serif; }
  img { max-width: 100%; }
  [hidden] { display: none !important; }
</style>
<title>GGF 파크 나이트게임</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=DotGothic16&family=Gothic+A1:wght@400;700;900&display=swap">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="park">

  <!-- 스코어보드 -->
  <div class="sb">
    <table>
      <thead>
        <tr id="sbHead">
          <th class="team">TEAM</th>
        </tr>
      </thead>
      <tbody>
        <tr class="away" id="sbAway"><td class="team"><i></i>GGF 유니콘스</td></tr>
        <tr class="home" id="sbHome"><td class="team"><i></i>블랙 베어스</td></tr>
      </tbody>
    </table>
  </div>

  <!-- 그라운드 -->
  <div class="stage" id="stage">
    <canvas id="cv"></canvas>

    <div class="hud hud--tl">
      <div class="cnt">
        <span>B</span><div class="row" id="dotsB"></div>
        <span>S</span><div class="row" id="dotsS"></div>
        <span>O</span><div class="row" id="dotsO"></div>
      </div>
      <div class="diamond" aria-hidden="true">
        <i class="b1" id="base1"></i><i class="b2" id="base2"></i><i class="b3" id="base3"></i>
      </div>
    </div>

    <div class="inn" id="innTag">1회 초</div>

    <div class="hud hud--tr">
      <div class="who">
        <span id="pitcherLine">P · —</span>
        <b id="batterName">—</b>
        <em id="batterLine">—</em>
      </div>
    </div>

    <div class="toast" id="toast" aria-hidden="true"></div>
    <div class="timing" id="timing" aria-hidden="true"></div>
  </div>

  <div class="lower">
    <!-- 타석 조작 -->
    <section class="panel">
      <div class="panel__head">타석 · AT BAT <span class="sp" id="deckState">대기</span></div>
      <div class="deck">
        <div class="swingrow">
          <button class="big" id="aimL" type="button" aria-pressed="false">◀ 당겨치기</button>
          <button class="big big--swing" id="btnSwing" type="button">스윙</button>
          <button class="big" id="aimR" type="button" aria-pressed="false">밀어치기 ▶</button>
        </div>
        <p class="keyhint">
          <code>Space</code> 스윙 · <code>←</code><code>→</code> 타구 방향 · <code>↑</code> 어퍼스윙(장타 노림) ·
          <code>Enter</code> 다음 투구. 그라운드를 탭해도 스윙한다.
        </p>
        <div class="opts">
          <div class="seg" role="group" aria-label="난이도">
            <button type="button" data-lv="easy" aria-pressed="false">연습</button>
            <button type="button" data-lv="normal" aria-pressed="true">정규</button>
            <button type="button" data-lv="hard" aria-pressed="false">포스트시즌</button>
          </div>
          <button class="ghost" id="btnNew" type="button">새 경기</button>
          <button class="ghost sp" id="btnSound" type="button" aria-pressed="true">사운드 ON</button>
        </div>
      </div>
    </section>

    <!-- 중계 -->
    <section class="panel">
      <div class="panel__head">중계석 · PLAY BY PLAY</div>
      <ol class="feed" id="feed" aria-live="polite">
        <li class="quiet">1회 초, GGF 유니콘스 공격. 초구를 기다리는 중.</li>
      </ol>
    </section>
  </div>

  <p class="sr" aria-live="assertive" id="live"></p>
</div>
<canvas id="fx" aria-hidden="true"></canvas>
<script src="game.js"></script>
</body>
</html>
